<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none" font-family="IBM Plex Sans, sans-serif">
  <!-- Signal thresholds: an RSSI (dBm) axis with Keith Parsons' five default
       bands (master scale, 19 Nov 2026): Excellent -66 and stronger, Good -67
       to -72, Fair -73 to -78, Poor -79 to -84, Unusable -85 and weaker. These
       are defaults the user can change in Signal Bands settings; the screen's
       table always shows the bands in force. Status palette (GL-003 §8.13):
       Unusable/Poor = danger, Fair = warning, Good/Excellent = success; each
       band labeled (never color-only). Lime = the VoIP design target (-67).
       No hatching. -->

  <!-- Header -->
  <text x="160" y="18" fill="#E5E5E5" font-size="13" font-weight="500" text-anchor="middle">Default RSSI bands (dBm)</text>

  <!-- Five bands above the axis. Axis spans x=14..306 (292px) over -92..-58
       (34 dB), px/dB = 8.588. Band edges sit between whole dBm values:
       -84.5 (x 78.4), -78.5 (x 129.9), -72.5 (x 181.5), -66.5 (x 233.0). -->
  <!-- Unusable (-85 and weaker) danger -->
  <rect x="14" y="40" width="64.4" height="40" rx="2" stroke="#F26E6E" stroke-width="1.75" fill="#F26E6E" fill-opacity="0.08"/>
  <text x="46.2" y="64" fill="#F26E6E" font-size="11" font-weight="500" text-anchor="middle">Unusable</text>
  <!-- Poor (-79 to -84) danger -->
  <rect x="78.4" y="40" width="51.5" height="40" rx="2" stroke="#F26E6E" stroke-width="1.75" fill="#F26E6E" fill-opacity="0.08"/>
  <text x="104.2" y="64" fill="#F26E6E" font-size="12" font-weight="500" text-anchor="middle">Poor</text>
  <!-- Fair (-73 to -78) warning -->
  <rect x="129.9" y="40" width="51.6" height="40" rx="2" stroke="#E0A23A" stroke-width="1.75" fill="#E0A23A" fill-opacity="0.08"/>
  <text x="155.7" y="64" fill="#E0A23A" font-size="12" font-weight="500" text-anchor="middle">Fair</text>
  <!-- Good (-67 to -72) success -->
  <rect x="181.5" y="40" width="51.5" height="40" rx="2" stroke="#5BD68A" stroke-width="1.75" fill="#5BD68A" fill-opacity="0.08"/>
  <text x="207.2" y="64" fill="#5BD68A" font-size="12" font-weight="500" text-anchor="middle">Good</text>
  <!-- Excellent (-66 and stronger) success -->
  <rect x="233" y="40" width="73" height="40" rx="2" stroke="#5BD68A" stroke-width="1.75" fill="#5BD68A" fill-opacity="0.08"/>
  <text x="269.5" y="64" fill="#5BD68A" font-size="11" font-weight="500" text-anchor="middle">Excellent</text>

  <!-- RSSI axis -->
  <line x1="14" y1="100" x2="306" y2="100" stroke="#E5E5E5" stroke-width="1.75" stroke-linecap="round"/>

  <!-- axis ticks at band edges -->
  <g stroke="#9C9C9C" stroke-width="1.25" stroke-linecap="round">
    <line x1="78.4"  y1="96" x2="78.4"  y2="104"/>
    <line x1="129.9" y1="96" x2="129.9" y2="104"/>
    <line x1="181.5" y1="96" x2="181.5" y2="104"/>
    <line x1="233"   y1="96" x2="233"   y2="104"/>
  </g>

  <!-- Band ranges (below axis, DM Mono), centered under each band -->
  <g fill="#9C9C9C" font-size="9" font-weight="500" text-anchor="middle" font-family="DM Mono, monospace">
    <text x="46.2"  y="117">&#8804; -85</text>
    <text x="104.2" y="117">-79..-84</text>
    <text x="155.7" y="117">-73..-78</text>
    <text x="207.2" y="117">-67..-72</text>
    <text x="269.5" y="117">&#8805; -66</text>
  </g>

  <!-- VoIP design target (lime): -67 dBm, the application table's VoIP minimum -->
  <line x1="228.7" y1="34" x2="228.7" y2="100" stroke="#A2CC3A" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="228.7" y="30" fill="#A2CC3A" font-size="11" font-weight="500" text-anchor="middle" font-family="DM Mono, monospace">VoIP &#8805; -67</text>

  <!-- Footer -->
  <text fill="#9C9C9C" font-size="11" font-weight="500" x="83.0" y="138.0" text-anchor="start">stronger signal (higher dBm)</text>
  <path d="M226.0 134.5 H234.0 M230.5 131.0 L234.0 134.5 L230.5 138.0" fill="none" stroke="#9C9C9C" stroke-width="1.2650000000000001" stroke-linecap="round" stroke-linejoin="round"/>
  <text fill="#9C9C9C" font-size="10" font-weight="500" x="160" y="154" text-anchor="middle">Keith Parsons' defaults. Change them in settings.</text>
</svg>
