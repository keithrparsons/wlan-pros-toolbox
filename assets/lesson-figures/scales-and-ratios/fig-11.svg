<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -4 784 298" font-family="IBM Plex Sans" width="784" height="298"><rect x="0.0" y="0.0" width="370.0" height="132.0" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.2"/><text x="150.0" y="58.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">A nanosecond is about</text><text x="150.0" y="80.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">a foot of light.</text><line x1="22" y1="66.0" x2="118" y2="66.0" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="22" cy="66.0" r="11.4" fill="#A1CC3A" fill-opacity="0.45"/><circle cx="22" cy="66.0" r="6" fill="#2F5E00"/><circle cx="118" cy="66.0" r="11.4" fill="#A1CC3A" fill-opacity="0.45"/><circle cx="118" cy="66.0" r="6" fill="#2F5E00"/><rect x="390.0" y="0.0" width="370.0" height="132.0" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.2"/><text x="540.0" y="58.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">Add 3 dB for double.</text><text x="540.0" y="80.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">Add 10 dB for ten times.</text><rect x="408.0" y="58.0" width="30.0" height="16.0" rx="3" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.8"/><circle cx="423.0" cy="66.0" r="4.2" fill="none" stroke="#2B5C8A" stroke-width="1.5"/><rect x="448.0" y="48.0" width="30.0" height="16.0" rx="3" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.8"/><circle cx="463.0" cy="56.0" r="4.2" fill="none" stroke="#2B5C8A" stroke-width="1.5"/><rect x="448.0" y="68.0" width="30.0" height="16.0" rx="3" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.8"/><circle cx="463.0" cy="76.0" r="4.2" fill="none" stroke="#2B5C8A" stroke-width="1.5"/><text x="504.0" y="72.0" font-size="16" font-weight="700" fill="#2F5E00" text-anchor="middle">x2</text><rect x="0.0" y="152.0" width="370.0" height="132.0" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.2"/><text x="150.0" y="210.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">Double the distance, and the</text><text x="150.0" y="232.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">signal drops to a quarter.</text><rect x="14" y="208.0" width="20" height="20" fill="#A1CC3A" stroke="#444444" stroke-width="1.4"/><rect x="56" y="198.0" width="20" height="20" fill="#A1CC3A" stroke="#444444" stroke-width="1.4"/><rect x="76" y="198.0" width="20" height="20" fill="#FFFFFF" stroke="#444444" stroke-width="1.4"/><rect x="56" y="218.0" width="20" height="20" fill="#FFFFFF" stroke="#444444" stroke-width="1.4"/><rect x="76" y="218.0" width="20" height="20" fill="#FFFFFF" stroke="#444444" stroke-width="1.4"/><rect x="390.0" y="152.0" width="370.0" height="132.0" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.2"/><text x="540.0" y="210.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">Divide Mbps by 8 to get</text><text x="540.0" y="232.0" font-size="15" font-weight="600" fill="#111111" text-anchor="start">megabytes a second.</text><rect x="443.0" y="201.6" width="38.0" height="43.4" rx="3" fill="#2B5C8A"/><rect x="447.9" y="188.0" width="28.2" height="9.6" rx="2" fill="none" stroke="#111111" stroke-width="1.8"/><path d="M447.9 197.6 C440.0 202.4 440.0 203.6 440.0 209.6 V244.0 Q440.0 248.0 444.0 248.0 H480.0 Q484.0 248.0 484.0 244.0 V209.6 C484.0 203.6 484.0 202.4 476.1 197.6" fill="none" stroke="#111111" stroke-width="1.8" stroke-linejoin="round"/></svg>
