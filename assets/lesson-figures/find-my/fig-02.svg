<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 150" font-family="DM Mono" font-size="11" width="330" height="150">
        <text x="8" y="16" font-family="IBM Plex Sans" font-size="12.5" font-weight="600" fill="#111111">The tag's ID changes about every 15 minutes</text>
        <path d="M10 70H320" stroke="#9C9C9C" stroke-width="2" fill="none"/>
        <g font-family="IBM Plex Sans" font-size="10" fill="#444444"><text x="10" y="92" font-size="12.5">9:00</text><text x="85" y="92" font-size="12.5">9:15</text><text x="160" y="92" font-size="12.5">9:30</text><text x="235" y="92" font-size="12.5">9:45</text></g>
        <rect x="10" y="44" width="68" height="20" rx="4" fill="#E6EEF6"/><text x="44" y="58" text-anchor="middle" fill="#2B5C8A" font-size="12.5">7F3A…</text>
        <rect x="85" y="44" width="68" height="20" rx="4" fill="#E6EEF6"/><text x="119" y="58" text-anchor="middle" fill="#2B5C8A" font-size="12.5">C019…</text>
        <rect x="160" y="44" width="68" height="20" rx="4" fill="#E6EEF6"/><text x="194" y="58" text-anchor="middle" fill="#2B5C8A" font-size="12.5">5B8E…</text>
        <rect x="235" y="44" width="68" height="20" rx="4" fill="#E6EEF6"/><text x="269" y="58" text-anchor="middle" fill="#2B5C8A" font-size="12.5">E24D…</text>
        <text x="8" y="120" font-family="IBM Plex Sans" font-size="12.5" fill="#444444">An eavesdropper sees four unrelated codes.</text>
        <text x="8" y="137" font-family="IBM Plex Sans" font-size="12.5" fill="#2F5E00" font-weight="600">Only your devices know they are the same tag.</text>
      </svg>
