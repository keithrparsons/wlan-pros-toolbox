<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="300">
    <!-- step boxes -->
    <g>
      <rect x="10" y="30" width="170" height="175" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
      <circle cx="30" cy="30" r="14" fill="#1A1A1A"/><text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-weight="600">1</text>
      <g transform="translate(59 65) scale(2.41667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="7" width="13" height="12" rx="2"/><path d="M9.5 7 V4 H14.5 V7 M9.5 10.5 V15.5 M14.5 10.5 V15.5"/><circle cx="8.5" cy="21" r="1.1" fill="#111111" stroke="none"/><circle cx="15.5" cy="21" r="1.1" fill="#111111" stroke="none"/></g><g transform="translate(99 97) scale(1.08333)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="13.5" r="7.5"/><circle cx="13.5" cy="13.5" r="3"/><circle cx="6" cy="6" r="3"/></g>
      <path d="M118 88a18 18 0 0 1 0 18M126 82a28 28 0 0 1 0 30" fill="none" stroke="#2B5C8A" stroke-width="2.5"/>
      <text x="95" y="150" text-anchor="middle" font-weight="600">Your AirTag</text>
      <text x="95" y="168" text-anchor="middle" font-size="13" fill="#444444">sends a short</text>
      <text x="95" y="183" text-anchor="middle" font-size="13" fill="#444444">Bluetooth "I'm here"</text>
    </g>
    <g>
      <rect x="200" y="30" width="170" height="175" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
      <circle cx="220" cy="30" r="14" fill="#1A1A1A"/><text x="220" y="35" text-anchor="middle" fill="#FFFFFF" font-weight="600">2</text>
      <g transform="translate(253 62) scale(2.66667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g>
      <text x="285" y="150" text-anchor="middle" font-weight="600">A stranger's iPhone</text>
      <text x="285" y="168" text-anchor="middle" font-size="13" fill="#444444">walks past and</text>
      <text x="285" y="183" text-anchor="middle" font-size="13" fill="#444444">hears it</text>
    </g>
    <g>
      <rect x="390" y="30" width="170" height="175" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
      <circle cx="410" cy="30" r="14" fill="#1A1A1A"/><text x="410" y="35" text-anchor="middle" fill="#FFFFFF" font-weight="600">3</text>
      <g transform="translate(445 64) scale(2.5)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2"/><path d="M8 10.5 V7.5 A4 4 0 0 1 16 7.5 V10.5 M12 15.2 V17.3"/><circle cx="12" cy="15" r="1.3" fill="#2F5E00" stroke="none"/></g>
      <text x="475" y="150" text-anchor="middle" font-weight="600">Seals its own location</text>
      <text x="475" y="168" text-anchor="middle" font-size="13" fill="#444444">in an envelope only</text>
      <text x="475" y="183" text-anchor="middle" font-size="13" fill="#444444">your devices can open</text>
    </g>
    <g>
      <rect x="580" y="30" width="170" height="175" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
      <circle cx="600" cy="30" r="14" fill="#1A1A1A"/><text x="600" y="35" text-anchor="middle" fill="#FFFFFF" font-weight="600">4</text>
      <g transform="translate(633 62) scale(2.66667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g><g transform="translate(654 81) scale(0.916667)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5 C12 21.5 19 14.8 19 9.5 A7 7 0 0 0 5 9.5 C5 14.8 12 21.5 12 21.5 Z"/><circle cx="12" cy="9.5" r="2.5"/></g>
      <text x="665" y="150" text-anchor="middle" font-weight="600">Your iPhone</text>
      <text x="665" y="168" text-anchor="middle" font-size="13" fill="#444444">opens it and puts</text>
      <text x="665" y="183" text-anchor="middle" font-size="13" fill="#444444">a dot on your map</text>
    </g>
    <path d="M180 118H198" stroke="#444444" stroke-width="2" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(198,118) rotate(360) scale(1.4) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><path d="M370 118H388" stroke="#444444" stroke-width="2" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(388,118) rotate(360) scale(1.4) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><path d="M560 118H578" stroke="#444444" stroke-width="2" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(578,118) rotate(360) scale(1.4) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><!-- apple relay band -->
    <rect x="390" y="228" width="360" height="56" rx="10" fill="#1A1A1A"/>
    <text x="570" y="252" text-anchor="middle" fill="#FFFFFF" font-weight="600">Apple's servers pass the sealed envelope along</text>
    <text x="570" y="272" text-anchor="middle" fill="#E5E5E5" font-size="13">Apple can't open it, and doesn't know who found what</text>
    <rect x="10" y="228" width="360" height="56" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="190" y="252" text-anchor="middle" font-weight="600">The stranger is never told</text>
    <text x="190" y="272" text-anchor="middle" fill="#444444" font-size="13">It happens in the background, anonymously</text>
  </svg>
