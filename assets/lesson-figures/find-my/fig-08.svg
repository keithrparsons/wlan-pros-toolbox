<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="300">
    <g>
      <rect x="10" y="20" width="160" height="80" rx="12" fill="#FBF0EE" stroke="#C0392B"/>
      <text x="90" y="52" text-anchor="middle" font-weight="600">Bag didn't arrive</text><text x="90" y="72" text-anchor="middle" font-size="13" fill="#444444">Check the map first</text>
    </g>
    <g>
      <rect x="205" y="20" width="160" height="80" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="285" y="52" text-anchor="middle" font-weight="600">File the airline's</text><text x="285" y="70" text-anchor="middle" font-weight="600">baggage report</text>
    </g>
    <g>
      <rect x="400" y="20" width="160" height="80" rx="12" fill="#A1CC3A" fill-opacity=".3" stroke="#7A9E26" stroke-width="2"/>
      <text x="480" y="46" text-anchor="middle" font-weight="600">Share Item Location</text><text x="480" y="66" text-anchor="middle" font-size="13" fill="#444444">Items › your tag › paste</text><text x="480" y="82" text-anchor="middle" font-size="13" fill="#444444">the link in their form</text>
    </g>
    <g>
      <rect x="595" y="20" width="155" height="80" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="672" y="52" text-anchor="middle" font-weight="600">Airline staff see</text><text x="672" y="70" text-anchor="middle" font-weight="600">a live map</text>
    </g>
    <path d="M170 60H203M365 60H398M560 60H593" stroke="#444444" stroke-width="2" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(593,60) rotate(360) scale(1.4) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><!-- clock -->
    <g transform="translate(400,130)">
      <rect width="350" height="70" rx="12" fill="#1A1A1A"/>
      <g transform="translate(19 16) scale(1.58333)" fill="none" stroke="#A1CC3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 V12 L15.5 14"/></g>
      <text x="70" y="28" fill="#FFFFFF" font-weight="600">The link stops by itself</text><text x="70" y="48" fill="#E5E5E5" font-size="13">when you're reunited, after 7 days,</text><text x="70" y="63" fill="#E5E5E5" font-size="13">or when you end it</text>
    </g>
    <!-- lost mode separate -->
    <g transform="translate(10,130)">
      <rect width="355" height="150" rx="12" fill="#FCF3E2" stroke="#8A5A00"/>
      <text x="18" y="30" font-weight="600">Separate switch: Show Contact Info</text>
      <text x="18" y="54" font-size="13" fill="#444444">Sharing the link does NOT mark the tag as lost.</text>
      <text x="18" y="74" font-size="13" fill="#444444">Also turn on Show Contact Info (once called</text>
      <text x="18" y="92" font-size="13" fill="#444444">Lost Mode) with a phone number and message.</text>
      <text x="18" y="110" font-size="13" fill="#444444">Anyone who taps the tag with an NFC phone</text>
      <text x="18" y="128" font-size="13" fill="#444444">sees them.</text>
    </g>
    <g transform="translate(400,220)">
      <rect width="350" height="60" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="18" y="26" font-weight="600">Keep a device online</text><text x="18" y="45" font-size="13" fill="#444444">Updates need one of your devices online.</text>
    </g>
  </svg>
