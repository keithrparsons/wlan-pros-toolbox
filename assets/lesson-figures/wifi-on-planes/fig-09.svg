<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" font-family="IBM Plex Sans" width="760" height="416"><rect x="35" y="50" width="150" height="270" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><line x1="94.0" y1="306" x2="126.0" y2="306" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none"/><text x="110.0" y="90.0" font-size="17" fill="#444444" text-anchor="middle" font-weight="600">Wi-Fi</text><rect x="45" y="106" width="130" height="40" rx="5" fill="#A1CC3A" stroke="#E5E5E5" stroke-width="1"/><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(53,114)"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#111111" stroke="none"/></g><text x="85.0" y="132.0" font-size="17" fill="#111111" text-anchor="start" font-weight="700">Airline</text><rect x="45" y="154" width="130" height="40" rx="5" fill="#F7F7F5" stroke="#E5E5E5" stroke-width="1"/><g fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(53,162)"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#444444" stroke="none"/></g><text x="85.0" y="180.0" font-size="17" fill="#444444" text-anchor="start" font-weight="400">Other</text><rect x="305" y="50" width="150" height="270" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><line x1="364.0" y1="306" x2="396.0" y2="306" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none"/><g fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(348,120) scale(2.667)"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12 H21"/></g><text x="380.0" y="222.0" font-size="18" fill="#111111" text-anchor="middle" font-weight="700">Test page?</text><rect x="575" y="50" width="150" height="270" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><line x1="634.0" y1="306" x2="666.0" y2="306" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none"/><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(630,76) scale(1.667)"><path d="M12 2.5 C13 2.5 13.5 3.5 13.5 4.5 V9.5 L21 14 V16 L13.5 13.5 V18.5 L15.5 20 V21.5 L12 20.5 L8.5 21.5 V20 L10.5 18.5 V13.5 L3 16 V14 L10.5 9.5 V4.5 C10.5 3.5 11 2.5 12 2.5 Z"/></g><rect x="589" y="134" width="122" height="40" rx="5" fill="#A1CC3A" stroke="#E5E5E5" stroke-width="1"/><text x="650.0" y="160.0" font-size="17" fill="#111111" text-anchor="middle" font-weight="700">Pay</text><rect x="589" y="182" width="122" height="40" rx="5" fill="#A1CC3A" stroke="#E5E5E5" stroke-width="1"/><text x="650.0" y="208.0" font-size="17" fill="#111111" text-anchor="middle" font-weight="700">Log in</text><rect x="589" y="230" width="122" height="40" rx="5" fill="#A1CC3A" stroke="#E5E5E5" stroke-width="1"/><text x="650.0" y="256.0" font-size="17" fill="#111111" text-anchor="middle" font-weight="700">Accept</text><circle cx="110.0" cy="20.0" r="15" fill="#1A1A1A"/><text x="110.0" y="25.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">1</text><text x="110.0" y="354.0" font-size="18" fill="#111111" text-anchor="middle" font-weight="700">You join the</text><text x="110.0" y="378.0" font-size="18" fill="#111111" text-anchor="middle" font-weight="700">plane's Wi-Fi</text><text x="110.0" y="402.0" font-size="17" fill="#444444" text-anchor="middle" font-weight="400">Usually no password</text><line x1="203.0" y1="185.0" x2="287.0" y2="185.0" stroke="#444444" stroke-width="3" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" transform="translate(287,185) scale(1.1) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><circle cx="380.0" cy="20.0" r="15" fill="#1A1A1A"/><text x="380.0" y="25.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">2</text><text x="380.0" y="354.0" font-size="18" fill="#111111" text-anchor="middle" font-weight="700">Your phone asks</text><text x="380.0" y="378.0" font-size="18" fill="#111111" text-anchor="middle" font-weight="700">for a test page</text><text x="380.0" y="402.0" font-size="17" fill="#444444" text-anchor="middle" font-weight="400">To check it's online</text><line x1="473.0" y1="185.0" x2="557.0" y2="185.0" stroke="#444444" stroke-width="3" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" transform="translate(557,185) scale(1.1) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><circle cx="650.0" cy="20.0" r="15" fill="#1A1A1A"/><text x="650.0" y="25.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">3</text><text x="650.0" y="354.0" font-size="18" fill="#111111" text-anchor="middle" font-weight="700">The plane sends</text><text x="650.0" y="378.0" font-size="18" fill="#111111" text-anchor="middle" font-weight="700">its sign-in page</text><text x="650.0" y="402.0" font-size="17" fill="#444444" text-anchor="middle" font-weight="400">Instead of the test page</text></svg>
