<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 700 200" font-family="IBM Plex Sans" width="700" height="200">
      <rect x="202" y="110" width="93" height="20" fill="#A1CC3A" opacity=".35"/>
      <line x1="268.9" y1="106" x2="268.9" y2="134" stroke="#2F5E00" stroke-width="3" fill="none"/>
      <line x1="40" y1="120" x2="660" y2="120" stroke="#444444" stroke-width="1.5" fill="none"/>
      <g font-size="10.5" fill="#444444" text-anchor="middle">
        <line x1="40" y1="116" x2="40" y2="124" stroke="#444444" fill="none"/><text x="40" y="143" font-size="12">0 km</text>
        <line x1="278.5" y1="116" x2="278.5" y2="124" stroke="#444444" fill="none"/>
        <line x1="516.9" y1="116" x2="516.9" y2="124" stroke="#444444" fill="none"/><text x="516.9" y="108" font-size="12">1,000 km (620 miles)</text>
      </g>
      <!-- ISS -->
      <line x1="235.5" y1="62" x2="235.5" y2="110" stroke="#2B5C8A" stroke-width="1.5" fill="none"/>
      <circle cx="235.5" cy="120" r="4" fill="#2B5C8A"/>
      <text x="235.5" y="38" font-size="13" fill="#1A1A1A" text-anchor="middle">Space Station</text><text x="235.5" y="54" font-size="13" fill="#1A1A1A" text-anchor="middle">about 400 km (250 miles)</text>
      <!-- Iridium -->
      <line x1="412" y1="62" x2="412" y2="116" stroke="#444444" stroke-width="1.2" fill="none"/>
      <circle cx="412" cy="120" r="4" fill="#444444"/>
      <text x="412" y="38" font-size="13" fill="#1A1A1A" text-anchor="middle">Iridium, 780 km</text><text x="412" y="54" font-size="13" fill="#1A1A1A" text-anchor="middle">(480 miles)</text>
      <!-- Amazon Leo -->
      <rect x="321.4" y="114" width="19.1" height="12" fill="#9C9C9C"/>
      <path d="M331 126 L331 140 L345 150" fill="none" stroke="#9C9C9C" stroke-width="1.2"/>
      <text x="349" y="155" font-size="13" fill="#1A1A1A">Amazon Leo</text><text x="349" y="171" font-size="13" fill="#1A1A1A">about 600 km (370 miles)</text>
      <!-- OneWeb -->
      <line x1="612.3" y1="92" x2="612.3" y2="116" stroke="#444444" stroke-width="1.2" fill="none"/>
      <circle cx="612.3" cy="120" r="4" fill="#444444"/>
      <text x="612.3" y="68" font-size="13" fill="#1A1A1A" text-anchor="middle">OneWeb, 1,200 km</text><text x="612.3" y="84" font-size="13" fill="#1A1A1A" text-anchor="middle">(750 miles)</text>
      <!-- Hubble -->
      <line x1="270.3" y1="138" x2="270.3" y2="194" stroke="#444444" stroke-width="1.2" fill="none"/>
      <text x="278" y="206" font-size="13" fill="#1A1A1A">Hubble, about 480 km (300 miles)</text>
      <text x="196" y="160" font-size="13" fill="#2F5E00" text-anchor="end" font-weight="600">Starlink</text>
      <text x="196" y="176" font-size="13" fill="#2F5E00" text-anchor="end" font-weight="600">mostly about</text>
      <text x="196" y="192" font-size="13" fill="#2F5E00" text-anchor="end" font-weight="600">480 km (300 miles)</text>
      <path d="M198 156 L215 132" stroke="#2F5E00" stroke-width="1.2" fill="none"/>
    </svg>
