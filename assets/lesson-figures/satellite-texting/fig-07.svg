<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460"><rect x="4" y="4" width="632" height="252" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.5"/><text x="24" y="38" font-family="IBM Plex Sans" font-size="18" font-weight="700" fill="#111111" text-anchor="start">It needs all four at once</text><g transform="translate(56 58) scale(2.6667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-45 12 12)"><rect x="10" y="10" width="4" height="4" rx="0.8"/><rect x="3" y="7" width="4.5" height="10" rx="0.8"/><rect x="16.5" y="7" width="4.5" height="10" rx="0.8"/><path d="M7.5 12 H10 M14 12 H16.5 M3 12 H7.5 M16.5 12 H21"/></g></g><text x="88" y="152" font-family="IBM Plex Sans" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">Open sky</text><text x="88" y="174" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">overhead</text><text x="166" y="100" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#444444" text-anchor="middle">+</text><g transform="translate(211 58) scale(2.6667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g><text x="243" y="152" font-family="IBM Plex Sans" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">A phone</text><text x="243" y="174" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">that has it</text><text x="321" y="100" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#444444" text-anchor="middle">+</text><g transform="translate(366 58) scale(2.6667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="17" height="10" rx="2"/><path d="M21.5 10.5 V13.5 M6 10 V14 M9.5 10 V14 M13 10 V14"/></g><text x="398" y="152" font-family="IBM Plex Sans" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">A charged</text><text x="398" y="174" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">battery</text><text x="476" y="100" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#444444" text-anchor="middle">+</text><g transform="translate(521 58) scale(2.6667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 V12 L15.5 14"/></g><text x="553" y="152" font-family="IBM Plex Sans" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">Time</text><text x="553" y="174" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">to wait</text><g transform="translate(150 204) scale(1.0833)" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L21.5 20 H2.5 Z"/><path d="M12 9.5 V14"/><circle cx="12" cy="17" r="1.2" fill="#8A5A00" stroke="none"/></g><text x="184" y="223" font-family="IBM Plex Sans" font-size="17" font-weight="700" fill="#8A5A00" text-anchor="start">Miss one, and it may not connect</text><rect x="4" y="272" width="632" height="184" rx="8" fill="#FFFFFF" stroke="#2F5E00" stroke-width="2.5"/><text x="24" y="306" font-family="IBM Plex Sans" font-size="18" font-weight="700" fill="#2F5E00" text-anchor="start">So leave your plan with someone</text><g transform="translate(40 330) scale(3.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5 C5 16 8 13.5 12 13.5 C16 13.5 19 16 19 20.5"/></g><text x="76" y="432" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">You</text><line x1="124" y1="366" x2="212" y2="366" stroke="#2F5E00" stroke-width="3.5" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" transform="translate(212,366) translate(-12,-7)"><path d="M1 1.5 L13 7 L1 12.5 Z" fill="#2F5E00"/></g><g transform="translate(220 326) scale(3.3333)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 3.5 L21 11"/><path d="M5.5 9.5 V20.5 H18.5 V9.5"/><path d="M10 20.5 V15 H14 V20.5"/></g><text x="260" y="432" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Someone at home</text><rect x="360" y="330" width="236" height="28" rx="6" fill="#A1CC3A"/><text x="478" y="349.6" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">Your route</text><rect x="360" y="376" width="236" height="28" rx="6" fill="#A1CC3A"/><text x="478" y="395.6" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">When you'll be back</text></svg>
