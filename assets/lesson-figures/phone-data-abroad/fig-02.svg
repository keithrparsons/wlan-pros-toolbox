<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="262">
    <!-- SIM card -->
    <g transform="translate(78 30) scale(2.66667)" fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5 H14.5 L18.5 6.5 V20 A1.5 1.5 0 0 1 17 21.5 H7 A1.5 1.5 0 0 1 5.5 20 V4 A1.5 1.5 0 0 1 7 2.5 Z"/><rect x="8.5" y="10.5" width="7" height="7" rx="1"/><path d="M8.5 14 H15.5"/></g>
    <text x="110" y="112" text-anchor="middle" font-weight="600">Physical SIM</text>
    <text x="110" y="128" text-anchor="middle" font-size="13" fill="#444444">a small card you insert</text>
    <!-- eSIM phone -->
    <g transform="translate(75 145) scale(2.91667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g><g transform="translate(100 168) scale(0.833333)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5 H14.5 L18.5 6.5 V20 A1.5 1.5 0 0 1 17 21.5 H7 A1.5 1.5 0 0 1 5.5 20 V4 A1.5 1.5 0 0 1 7 2.5 Z"/><rect x="8.5" y="10.5" width="7" height="7" rx="1"/><path d="M8.5 14 H15.5"/></g>
    <text x="110" y="232" text-anchor="middle" font-weight="600">eSIM</text>
    <text x="110" y="248" text-anchor="middle" font-size="13" fill="#444444">the same key, downloaded</text>
    <!-- arrows -->
    <path d="M150 62 L420 110" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(420,110) rotate(10.081) scale(1.4) translate(-14,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><path d="M142 176 L424 134" stroke="#2F5E00" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(424,134) rotate(351.529) scale(1.4) translate(-14,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><!-- tower -->
    <g transform="translate(455,122)"><g transform="translate(-26 -28) scale(2.16667)" fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9 H15.5 M8.5 9 L6.5 21.5 M15.5 9 L17.5 21.5 M12 9 V3"/><path d="M8.5 9 L16.5 15.2 M15.5 9 L7.5 15.2 M7.5 15.2 H16.5 M7.5 15.2 L17.5 21.5 M16.5 15.2 L6.5 21.5"/><path d="M8.3 1.9 A5 5 0 0 0 8.3 7.1 M15.7 1.9 A5 5 0 0 1 15.7 7.1"/></g><text y="44" text-anchor="middle" font-size="13">the same towers</text></g>
    <path d="M488 122 H548" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(548,122) rotate(360) scale(1.4) translate(-14,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><!-- carrier -->
    <rect x="560" y="72" width="190" height="100" rx="12" fill="#1A1A1A"/>
    <text x="655" y="104" text-anchor="middle" fill="#FFFFFF" font-weight="600" font-size="14">The carrier</text>
    <text x="655" y="126" text-anchor="middle" fill="#E5E5E5" font-size="13">checks the key,</text>
    <text x="655" y="144" text-anchor="middle" fill="#E5E5E5" font-size="13">then carries your calls,</text>
    <text x="655" y="162" text-anchor="middle" fill="#E5E5E5" font-size="13">texts and data</text>
  </svg>
