    <rect x="418" y="20" width="338" height="76" rx="10" fill="#FFFFFF" stroke="#444444" stroke-width="2"/>
    <text x="432" y="46" font-weight="600">1. Your home carrier's roaming plan</text>
    <text x="432" y="66" font-size="13" fill="#444444">Same number, same phone plan. A daily fee or</text>
    <text x="432" y="83" font-size="13" fill="#444444">an allowance. The bill arrives when you're home.</text>
    <rect x="418" y="114" width="338" height="76" rx="10" fill="#FFFFFF" stroke="#2F5E00" stroke-width="2"/>
    <text x="432" y="140" font-weight="600">2. A travel eSIM</text>
    <text x="432" y="160" font-size="13" fill="#444444">Prepaid data, bought before you go. Usually no</text>
    <text x="432" y="177" font-size="13" fill="#444444">phone number. Usually rides local partner networks.</text>
    <rect x="418" y="208" width="338" height="76" rx="10" fill="#FFFFFF" stroke="#2B5C8A" stroke-width="2"/>
    <text x="432" y="234" font-weight="600">3. A local SIM or local eSIM</text>
    <text x="432" y="254" font-size="13" fill="#444444">A plan from a carrier in that country. Local</text>
    <text x="432" y="271" font-size="13" fill="#444444">prices, and often a local phone number.</text>
  </svg>
