<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans" font-size="12" fill="#111111" width="760" height="250">
    <text x="20" y="18" font-weight="600" font-size="13">A $12 daily fee, added up over a trip</text>
    <!-- axis: $0 at y=220, 1px = $1 -->
    <g font-size="11" fill="#444444" text-anchor="end">
      <text x="70" y="224" font-size="13">$0</text><text x="70" y="174" font-size="13">$50</text><text x="70" y="124" font-size="13">$100</text><text x="70" y="74" font-size="13">$150</text>
    </g>
    <path d="M80 220 H740" stroke="#444444" stroke-width="1.5" fill="none"/>
    <path d="M80 170 H740 M80 70 H740" stroke="#9C9C9C" stroke-width="1" fill="none"/>
    <!-- $100 reference line (drawn first; bars cover it) -->
    <path d="M80 120 H740" stroke="#2B5C8A" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
    <rect x="84" y="99" width="176" height="16" fill="#F7F7F5"/>
    <text x="88" y="111" fill="#2B5C8A" font-weight="600" font-size="13">$100 monthly plan (Verizon)</text>
    <!-- bars: 3,7,10,14 days = 36,84,120,168 -->
    <rect x="290" y="184" width="70" height="36" fill="#A1CC3A"/><text x="325" y="206" text-anchor="middle" font-weight="600" fill="#1A1A1A" font-size="13">$36</text>
    <rect x="400" y="136" width="70" height="84" fill="#A1CC3A"/><text x="435" y="156" text-anchor="middle" font-weight="600" fill="#1A1A1A" font-size="13">$84</text>
    <rect x="510" y="100" width="70" height="120" fill="#2F5E00"/><text x="545" y="120" text-anchor="middle" font-weight="600" fill="#FFFFFF" font-size="13">$120</text>
    <rect x="620" y="52" width="70" height="168" fill="#2F5E00"/><text x="655" y="72" text-anchor="middle" font-weight="600" fill="#FFFFFF" font-size="13">$168</text>
    <g text-anchor="middle" fill="#444444"><text x="325" y="238" font-size="13">3 days</text><text x="435" y="238" font-size="13">7 days</text><text x="545" y="238" font-size="13">10 days</text><text x="655" y="238" font-size="13">14 days</text></g>
  </svg>
