<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="IBM Plex Sans" width="700" height="250">
      <!-- line 1: home number -->
      <path d="M122 100 L546 60" fill="none" stroke="#444444" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
      <text x="170" y="42" fill="#444444" font-size="15">Line 1: your own number, for calls and texts</text>
      <!-- line 2: travel data -->
      <path d="M122 152 L344 182" fill="none" stroke="#A1CC3A" stroke-width="10" stroke-linecap="round" opacity=".35"/>
      <path d="M122 152 L344 182" fill="none" stroke="#7A9E26" stroke-width="3" stroke-linecap="round"/>
      <path d="M418 186 H562" fill="none" stroke="#A1CC3A" stroke-width="10" stroke-linecap="round" opacity=".35"/>
      <path d="M418 186 H562" fill="none" stroke="#7A9E26" stroke-width="3" stroke-linecap="round"/>
      <text x="150" y="214" fill="#2F5E00" font-size="15">Line 2: data for the trip</text>
      <!-- phone -->
      <g transform="translate(80,126)"><rect x="-28" y="-52" width="56" height="104" rx="10" fill="#1A1A1A"/><rect x="-23" y="-44" width="46" height="86" rx="4" fill="#E6EEF6"/>
        <rect x="-15" y="-30" width="30" height="16" rx="3" fill="#444444"/><text y="-18" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">1</text>
        <rect x="-15" y="16" width="30" height="16" rx="3" fill="#7A9E26"/><text y="28" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">2</text></g>
      <!-- tower -->
      <g transform="translate(381,186)"><g transform="translate(-26 -28) scale(2.16667)" fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9 H15.5 M8.5 9 L6.5 21.5 M15.5 9 L17.5 21.5 M12 9 V3"/><path d="M8.5 9 L16.5 15.2 M15.5 9 L7.5 15.2 M7.5 15.2 H16.5 M7.5 15.2 L17.5 21.5 M16.5 15.2 L6.5 21.5"/><path d="M8.3 1.9 A5 5 0 0 0 8.3 7.1 M15.7 1.9 A5 5 0 0 1 15.7 7.1"/></g><text y="46" text-anchor="middle" fill="#444444" font-size="15">A local network</text></g>
      <!-- globe -->
      <g transform="translate(600,186)"><g transform="translate(-28 -28) scale(2.33333)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12 H21"/></g><text y="50" text-anchor="middle" fill="#444444" font-size="15">The internet</text></g>
      <!-- home carrier -->
      <g transform="translate(620,56)"><rect x="-64" y="-36" width="128" height="72" rx="10" fill="#1A1A1A"/><text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Your carrier</text><text y="14" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">at home</text></g>
    </svg>
