r="middle">Same data</text><text x="348" y="236" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#111111" text-anchor="start">Tap once</text><rect x="475" y="215.5" width="146" height="29" rx="6" fill="#A1CC3A"/><text x="548" y="235.95" font-family="IBM Plex Sans" font-size="17" font-weight="600" fill="#111111" text-anchor="middle">New code</text><text x="26" y="296" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#111111" text-anchor="start">Swipe again</text><rect x="153" y="275.5" width="146" height="29" rx="6" fill="#F7F7F5" stroke="#444444" stroke-width="1.5"/><text x="226" y="295.95" font-family="IBM Plex Sans" font-size="17" font-weight="600" fill="#111111" text-anchor="middle">Same data</text><text x="348" y="296" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#111111" text-anchor="start">Tap again</text><rect x="475" y="275.5" width="146" height="29" rx="6" fill="#A1CC3A"/><text x="548" y="295.95" font-family="IBM Plex Sans" font-size="17" font-weight="600" fill="#111111" text-anchor="middle">New code</text><text x="159" y="360" font-family="IBM Plex Sans" font-size="19" font-weight="700" fill="#8A5A00" text-anchor="middle">A copy works again</text><text x="159" y="388" font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#444444" text-anchor="middle">Thieves can reuse it</text><text x="481" y="360" font-family="IBM Plex Sans" font-size="19" font-weight="700" fill="#2F5E00" text-anchor="middle">A copy is useless</text><text x="481" y="388" font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#444444" text-anchor="middle">It won't work twice</text></svg>
