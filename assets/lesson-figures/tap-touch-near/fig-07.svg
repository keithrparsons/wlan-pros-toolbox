xt-anchor="middle">Passport book</text><text x="320" y="192" font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#444444" text-anchor="middle">Shielding is</text><text x="320" y="212.8" font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#444444" text-anchor="middle">in the cover</text><circle cx="320" cy="262" r="16" fill="#2F5E00"/><path d="M312.8 262.32 L318.4 268.08 L327.68 256.4" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="310" font-family="IBM Plex Sans" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Just close it</text><text x="530" y="164" font-family="IBM Plex Sans" font-size="19" font-weight="700" fill="#111111" text-anchor="middle">Passport card</text><text x="530" y="192" font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#444444" text-anchor="middle">Made to be read</text><text x="530" y="212.8" font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#444444" text-anchor="middle">from farther away</text><circle cx="530" cy="262" r="16" fill="#2F5E00"/><path d="M522.8 262.32 L528.4 268.08 L537.68 256.4" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="290" width="196" height="28" rx="6" fill="#A1CC3A"/><text x="530" y="309.6" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">Keep it in its sleeve</text></svg>
