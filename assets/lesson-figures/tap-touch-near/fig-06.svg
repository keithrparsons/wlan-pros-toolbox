height="3.5" rx="0.8"/><path d="M5.5 15.5 H12"/></g><text x="112" y="214" font-family="IBM Plex Sans" font-size="16" font-weight="700" fill="#2F5E00" text-anchor="middle">Almost touching</text><line x1="198" y1="134" x2="252" y2="134" stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" transform="translate(252,134) translate(-12,-7)"><path d="M1 1.5 L13 7 L1 12.5 Z" fill="#111111"/></g><rect x="260" y="119" width="120" height="30" rx="6" fill="#A1CC3A"/><text x="320" y="140.3" font-family="DM Mono" font-size="18" font-weight="600" fill="#111111" text-anchor="middle">RKTW</text><text x="320" y="214" font-family="IBM Plex Sans" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">A code that works once</text><line x1="388" y1="134" x2="482" y2="134" stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" transform="translate(482,134) translate(-12,-7)"><path d="M1 1.5 L13 7 L1 12.5 Z" fill="#111111"/></g><g transform="translate(490 94) scale(3.3333)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 L12 3.5 L21 9 Z M3 20.5 H21 M4.5 17.5 H19.5 M6.5 11.5 V15 M10 11.5 V15 M14 11.5 V15 M17.5 11.5 V15"/></g><circle cx="584" cy="110" r="14" fill="#111111"/><path d="M578.68 104.68 L589.32 115.32 M589.32 104.68 L578.68 115.32" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/><text x="530" y="214" font-family="IBM Plex Sans" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">Turned down</text><text x="112" y="246" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">They'd need a reader</text><text x="112" y="265.5" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">pressed to your bag.</text><text x="320" y="246" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">Once that code is used,</text><text x="320" y="265.5" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">it's spent.</text><text x="530" y="246" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">The bank has seen it,</text><text x="530" y="265.5" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="middle">so it says no.</text><rect x="140" y="308" width="360" height="46" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.5"/><circle cx="168" cy="331" r="12" fill="#2F5E00"/><path d="M162.6 331.24 L166.8 335.56 L173.76 326.8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="337" font-family="IBM Plex Sans" font-size="17" font-weight="600" fill="#111111" text-anchor="start">No shield needed for bank cards</text></svg>
