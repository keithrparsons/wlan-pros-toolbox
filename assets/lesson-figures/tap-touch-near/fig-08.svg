<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344"><text x="84" y="30" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#444444" text-anchor="start">The real risk</text><text x="505" y="30" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#444444" text-anchor="middle">What to do</text><g transform="translate(12 63) scale(2.4167)" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="10" height="17" rx="1.5"/><rect x="6.5" y="6" width="5" height="4" rx="0.8"/><path d="M2.5 20.5 H15.5 M14 9 H16 A1.5 1.5 0 0 1 17.5 10.5 V16.5 A1.5 1.5 0 0 0 20.5 16.5 V8.5 L18.5 6.5"/></g><text x="84" y="89" font-family="IBM Plex Sans" font-size="17" font-weight="700" fill="#111111" text-anchor="start">A skimmer at the pump</text><text x="84" y="112" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="start">hidden in the card slot</text><line x1="304" y1="92" x2="372" y2="92" stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" transform="translate(372,92) translate(-12,-7)"><path d="M1 1.5 L13 7 L1 12.5 Z" fill="#111111"/></g><rect x="378" y="78" width="254" height="28" rx="6" fill="#A1CC3A"/><text x="505" y="97.6" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">Tap or insert. Don't swipe.</text><g transform="translate(12 167) scale(2.4167)" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g><text x="84" y="193" font-family="IBM Plex Sans" font-size="17" font-weight="700" fill="#111111" text-anchor="start">A lost phone or wallet</text><text x="84" y="216" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="start">with cards and keys inside</text><line x1="304" y1="196" x2="372" y2="196" stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" transform="translate(372,196) translate(-12,-7)"><path d="M1 1.5 L13 7 L1 12.5 Z" fill="#111111"/></g><rect x="378" y="182" width="254" height="28" rx="6" fill="#A1CC3A"/><text x="505" y="201.6" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">Mark it lost right away</text><g transform="translate(12 271) scale(2.4167)" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5 H6 C4.5 3.5 3.5 4.7 3.6 6.2 C4.3 13.8 10.2 19.7 17.8 20.4 C19.3 20.5 20.5 19.5 20.5 18 V15.5 L16.5 14 L14.5 16 C11.5 14.7 9.3 12.5 8 9.5 L10 7.5 Z"/></g><text x="84" y="297" font-family="IBM Plex Sans" font-size="17" font-weight="700" fill="#111111" text-anchor="start">A caller asks for a code</text><text x="84" y="320" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#444444" text-anchor="start">pretending to be your bank</text><line x1="304" y1="300" x2="372" y2="300" stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none"/><g fill="black" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" transform="translate(372,300) translate(-12,-7)"><path d="M1 1.5 L13 7 L1 12.5 Z" fill="#111111"/></g><rect x="378" y="286" width="254" height="28" rx="6" fill="#A1CC3A"/><text x="505" y="305.6" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">Hang up. Call your bank.</text></svg>
