<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="250">
    <!-- left panel -->
    <rect x="10" y="10" width="360" height="230" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="30" y="40" font-weight="600" font-size="15">1. Pairing: once</text>
    <text x="30" y="60" font-size="13" fill="#444444">The two devices meet and agree on a secret key.</text>
    <g transform="translate(70,140)"><g transform="translate(-44.8 -44.8) scale(3.73333)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g></g>
    <g transform="translate(310,136)"><g transform="translate(-30 -26) scale(2.5)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1) rotate(-8 5.5 13)"><path d="M4 17 V7.2 A3.4 3.4 0 1 1 7.4 10.6 H6.9 V17 A1.45 1.45 0 0 1 4 17 Z"/><circle cx="10.9" cy="6.6" r="1.25" fill="#111111" stroke="none"/></g><g transform="translate(0 1) translate(24 0) scale(-1 1) rotate(-8 5.5 13)"><path d="M4 17 V7.2 A3.4 3.4 0 1 1 7.4 10.6 H6.9 V17 A1.45 1.45 0 0 1 4 17 Z"/><circle cx="10.9" cy="6.6" r="1.25" fill="#111111" stroke="none"/></g></g></g>
    <path d="M102 140 H158" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(158,140) rotate(360) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(102,140) rotate(180) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><g transform="translate(190,140)"><circle cx="-10" cy="0" r="10" fill="none" stroke="#2F5E00" stroke-width="3"/><path d="M0 0 H20 M12 0 V8 M18 0 V6" fill="none" stroke="#2F5E00" stroke-width="3" stroke-linecap="round"/></g>
    <path d="M222 140 H274" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(274,140) rotate(360) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(222,140) rotate(180) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><text x="190" y="182" text-anchor="middle" font-size="13" fill="#444444">Both devices save the key.</text>
    <text x="190" y="200" text-anchor="middle" font-size="13" fill="#444444">You tap a name, or confirm a code.</text>
    <text x="190" y="226" text-anchor="middle" font-size="13" fill="#2F5E00" font-weight="600">Needs pairing mode on the earbuds or car</text>
    <!-- right panel -->
    <rect x="390" y="10" width="360" height="230" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="410" y="40" font-weight="600" font-size="15">2. Connecting: every time after</text>
    <text x="410" y="60" font-size="13" fill="#444444">They find each other and use the saved key.</text>
    <g transform="translate(450,140)"><g transform="translate(-44.8 -44.8) scale(3.73333)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g></g>
    <g transform="translate(690,136)"><g transform="translate(-30 -26) scale(2.5)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1) rotate(-8 5.5 13)"><path d="M4 17 V7.2 A3.4 3.4 0 1 1 7.4 10.6 H6.9 V17 A1.45 1.45 0 0 1 4 17 Z"/><circle cx="10.9" cy="6.6" r="1.25" fill="#111111" stroke="none"/></g><g transform="translate(0 1) translate(24 0) scale(-1 1) rotate(-8 5.5 13)"><path d="M4 17 V7.2 A3.4 3.4 0 1 1 7.4 10.6 H6.9 V17 A1.45 1.45 0 0 1 4 17 Z"/><circle cx="10.9" cy="6.6" r="1.25" fill="#111111" stroke="none"/></g></g></g>
    <path d="M482 140 H654" stroke="#7A9E26" stroke-width="3" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(654,140) rotate(360) scale(2.1) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#7A9E26"/></g><g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(482,140) rotate(180) scale(2.1) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#7A9E26"/></g><text x="568" y="182" text-anchor="middle" font-size="13" fill="#444444">Happens on its own, in seconds,</text>
    <text x="568" y="200" text-anchor="middle" font-size="13" fill="#444444">when both are on and in range.</text>
    <text x="568" y="226" text-anchor="middle" font-size="13" fill="#2F5E00" font-weight="600">No pairing mode needed</text>
  </svg>
