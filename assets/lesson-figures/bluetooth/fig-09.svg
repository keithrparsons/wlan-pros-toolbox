<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="IBM Plex Sans" font-size="15" fill="#111111" width="760" height="270"><text x="20" y="24" font-size="16" font-weight="600" fill="#111111" text-anchor="start">Easiest first. Stop as soon as it works.</text><rect x="20" y="44" width="210" height="82" rx="8" fill="#A1CC3A" stroke="#2F5E00" stroke-width="1.5"/><circle cx="44" cy="68" r="12" fill="#1A1A1A"/><text x="44" y="73" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><g transform="translate(32.0 90.0) scale(1.00000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g><text x="68" y="72" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Restart the phone</text><text x="68" y="92" font-size="15" font-weight="400" fill="#111111" text-anchor="start">and the car</text><rect x="275" y="44" width="210" height="82" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.5"/><circle cx="299" cy="68" r="12" fill="#1A1A1A"/><text x="299" y="73" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><g transform="translate(287.0 90.0) scale(1.00000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5 L17 16.5 L12 21 V3 L17 7.5 L7 16.5"/></g><text x="323" y="72" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Bluetooth off,</text><text x="323" y="92" font-size="15" font-weight="400" fill="#111111" text-anchor="start">then back on</text><rect x="530" y="44" width="210" height="82" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.5"/><circle cx="554" cy="68" r="12" fill="#1A1A1A"/><text x="554" y="73" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><g transform="translate(542.0 90.0) scale(1.00000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#111111" stroke="none"/></g><text x="578" y="72" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Wi-Fi on too, for</text><text x="578" y="92" font-size="15" font-weight="400" fill="#111111" text-anchor="start">wireless CarPlay</text><text x="578" y="112" font-size="15" font-weight="400" fill="#111111" text-anchor="start">or Android Auto</text><rect x="20" y="176" width="210" height="82" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.5"/><circle cx="44" cy="200" r="12" fill="#1A1A1A"/><text x="44" y="205" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><g transform="translate(32.0 222.0) scale(1.00000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17 H3 V13.2 L5.6 8.5 H15.6 L18.8 12.4 C20.4 12.7 21 13.6 21 14.8 V17 H19 M9 17 H15"/><path d="M3.8 12.5 H18.6"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></g><text x="68" y="204" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Delete unused</text><text x="68" y="224" font-size="15" font-weight="400" fill="#111111" text-anchor="start">phones on the car</text><rect x="275" y="176" width="210" height="82" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.5"/><circle cx="299" cy="200" r="12" fill="#1A1A1A"/><text x="299" y="205" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><g transform="translate(287.0 222.0) scale(1.00000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 L19.5 5.5 V11 C19.5 16 16.5 19.5 12 21.5 C7.5 19.5 4.5 16 4.5 11 V5.5 Z"/><path d="M8.5 12 L11 14.5 L15.5 9.5"/></g><text x="323" y="204" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Update the phone</text><text x="323" y="224" font-size="15" font-weight="400" fill="#111111" text-anchor="start">and the car stereo</text><rect x="530" y="176" width="210" height="82" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.5"/><circle cx="554" cy="200" r="12" fill="#1A1A1A"/><text x="554" y="205" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text><g transform="translate(542.0 222.0) scale(1.00000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5 L17 16.5 L12 21 V3 L17 7.5 L7 16.5"/></g><text x="578" y="204" font-size="15" font-weight="600" fill="#111111" text-anchor="start">Last resort:</text><text x="578" y="224" font-size="15" font-weight="400" fill="#111111" text-anchor="start">forget, then</text><text x="578" y="244" font-size="15" font-weight="400" fill="#111111" text-anchor="start">pair again</text><path d="M238 85 H267" stroke="#444444" stroke-width="2" fill="none"/><g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="15" transform="translate(267,85) rotate(360) scale(1.2) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><path d="M493 85 H522" stroke="#444444" stroke-width="2" fill="none"/><g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="15" transform="translate(522,85) rotate(360) scale(1.2) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><path d="M238 217 H267" stroke="#444444" stroke-width="2" fill="none"/><g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" 