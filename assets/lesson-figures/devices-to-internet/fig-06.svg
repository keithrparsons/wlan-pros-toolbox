<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="250">
      <!-- unused Wi-Fi road, grey -->
      <line x1="80" y1="108" x2="180" y2="66" stroke="#9C9C9C" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" fill="none"/>
      <rect x="190" y="40" width="84" height="40" rx="7" fill="#E5E5E5"/>
      <text x="232" y="65" text-anchor="middle" font-weight="600" fill="#444444" font-size="12.5">the box</text>
      <text x="232" y="28" text-anchor="middle" fill="#444444" font-size="12.5">not used on cellular</text>
      <line x1="286" y1="60" x2="560" y2="98" stroke="#9C9C9C" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" fill="none"/>
      <!-- phone -->
      <g transform="translate(8.45 86.45) scale(3.54583)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g>
      <!-- cellular road -->
      <line x1="80" y1="146" x2="172" y2="184" stroke="#2B5C8A" stroke-width="4" stroke-linecap="round" fill="none"/>
      <g transform="translate(158 142) scale(3.5)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9 H15.5 M8.5 9 L6.5 21.5 M15.5 9 L17.5 21.5 M12 9 V3"/><path d="M8.5 9 L16.5 15.2 M15.5 9 L7.5 15.2 M7.5 15.2 H16.5 M7.5 15.2 L17.5 21.5 M16.5 15.2 L6.5 21.5"/><path d="M8.3 1.9 A5 5 0 0 0 8.3 7.1 M15.7 1.9 A5 5 0 0 1 15.7 7.1"/></g>
      <line x1="232" y1="190" x2="560" y2="146" stroke="#2B5C8A" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- cloud (620,126) -->
      <g transform="translate(580 82) scale(3.5)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19 H17 A4 4 0 0 0 17.6 11.05 A6 6 0 0 0 6.2 10.5 A4.3 4.3 0 0 0 7 19 Z"/></g>
      <!-- labels -->
      <text x="51" y="186" text-anchor="middle" font-size="12.5">your phone</text>
      <text x="200" y="242" text-anchor="middle" font-size="12.5">cell tower</text>
      <text x="410" y="212" text-anchor="middle" font-weight="600" fill="#2B5C8A" font-size="12.5">your carrier's own network</text>
      <text x="620" y="176" text-anchor="middle" font-size="12.5">the internet</text>
    </svg>
