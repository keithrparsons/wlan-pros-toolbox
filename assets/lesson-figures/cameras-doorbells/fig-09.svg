      <line x1="20" y1="160" x2="700" y2="160" stroke="#9C9C9C" stroke-width="1.5" fill="none"/>
      <!-- Row 1: wireless, cloud only (c=42) -->
      <g transform="translate(32 16) scale(2.16667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4 V12 M3 8 H6"/><path d="M6 5 L19 8 L18.2 13 L6 10.5 Z"/><circle cx="16.6" cy="10.3" r="1.2" fill="#111111" stroke="none"/><path d="M11 11.6 L10 16.5 H7"/></g>
      <g transform="rotate(90 109.1 41.9) translate(94.1 26.9) scale(1.25)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#2F5E00" stroke="none"/></g>
