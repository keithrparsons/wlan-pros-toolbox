<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="190">
      <!-- camera -->
      <g transform="translate(32 84) scale(2.16667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4 V12 M3 8 H6"/><path d="M6 5 L19 8 L18.2 13 L6 10.5 Z"/><circle cx="16.6" cy="10.3" r="1.2" fill="#111111" stroke="none"/><path d="M11 11.6 L10 16.5 H7"/></g>
      <!-- arcs centred (94,110) -->
      <g transform="rotate(90 110.5 109.9) translate(95.5 94.9) scale(1.25)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#2F5E00" stroke="none"/></g>
      <!-- box -->
      <g transform="translate(158.2 73.2) scale(3.06667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5.5" width="16" height="9" rx="2"/><path d="M18 10 H19.5 C20.9 10 21.5 10.8 21.5 12 V21"/><circle cx="6" cy="10" r="1.1" fill="#111111" stroke="none"/><circle cx="9" cy="10" r="1.1" fill="#111111" stroke="none"/><circle cx="12" cy="10" r="1.1" fill="#111111" stroke="none"/></g>
      <!-- download: cloud to box, tip 10 short of the box -->
      <line x1="543" y1="97" x2="262" y2="97" stroke="#7A9E26" stroke-width="5" stroke-linecap="round" fill="none"/>
      <polygon points="250,97 263,90 263,104" fill="#7A9E26"/>
      <!-- upload: box to cloud, tip 12 short of the cloud -->
      <line x1="252" y1="123" x2="523" y2="123" stroke="#2B5C8A" stroke-width="5" stroke-linecap="round" fill="none"/>
      <polygon points="536,123 523,116 523,130" fill="#2B5C8A"/>
      <!-- cloud -->
      <g transform="translate(558 66) scale(3.5)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19 H17 A4 4 0 0 0 17.6 11.05 A6 6 0 0 0 6.2 10.5 A4.3 4.3 0 0 0 7 19 Z"/></g>
      <!-- labels -->
      <text x="398" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#2F5E00">Download: what comes to you</text>
      <text x="398" y="81" text-anchor="middle" font-size="12.5">movies, web pages, app updates</text>
      <text x="394" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#2B5C8A">Upload: what you send</text>
      <text x="394" y="169" text-anchor="middle" font-size="12.5">camera video, video calls, photo backups</text>
      <text x="58" y="160" text-anchor="middle" font-size="12.5">camera</text>
      <text x="195" y="152" text-anchor="middle" font-size="12.5">the box</text>
      <text x="598" y="160" text-anchor="middle" font-size="12.5">the internet</text>
    </svg>
