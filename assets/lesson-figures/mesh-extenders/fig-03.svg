<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="330">
      <!-- icons -->
      <g transform="translate(30,40)"><g transform="translate(20,0) scale(1.667)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="18" height="7.5" rx="2"/><path d="M7.5 12 L6 4.5 M16.5 12 L18 4.5"/><circle cx="7.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="10.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="13.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/></g></g></g><g transform="translate(330,40)"><g transform="translate(0,3) scale(1.833)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5 V20.5"/><rect x="6" y="6" width="8" height="12" rx="2"/><path d="M6 9.5 H2.5 M6 14.5 H2.5"/><path d="M17 9 A4 4 0 0 1 17 15 M19.8 6.5 A7.2 7.2 0 0 1 19.8 17.5"/></g></g></g><g transform="translate(620,37)"><g transform="translate(13,0) scale(1.917)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M2 19 H22"/></g></g></g><g stroke="#2B5C8A" stroke-width="4" stroke-dasharray="1 8" stroke-linecap="round"><line x1="126" y1="60" x2="314" y2="60" fill="none"/></g>
      <g stroke="#7A9E26" stroke-width="4" stroke-dasharray="1 8" stroke-linecap="round"><line x1="390" y1="60" x2="604" y2="60" fill="none"/></g>
      <circle cx="220" cy="36" r="10" fill="#2B5C8A"/><text x="220" y="40" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="12.5">1</text>
      <circle cx="497" cy="36" r="10" fill="#7A9E26"/><text x="497" y="40" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="12.5">2</text>
      <text x="70" y="98" text-anchor="middle" font-size="12.5">main box</text>
      <text x="352" y="108" text-anchor="middle" font-weight="600" fill="#111111" font-size="12.5">extender: one radio</text>
      <text x="656" y="101" text-anchor="middle" font-size="12.5">your laptop</text>

      <!-- shared channel timeline -->
      <text x="20" y="150" font-size="13" font-weight="700" fill="#111111">One radio, one channel</text>
      <text x="20" y="168" font-size="12.5">the hops take turns</text>
      <g font-size="11" font-weight="700" text-anchor="middle">
        <rect x="210" y="140" width="75" height="30" rx="4" fill="#2B5C8A"/><text x="247.5" y="159" fill="#FFFFFF" font-size="12.5">1</text>
        <rect x="289" y="140" width="75" height="30" rx="4" fill="#A1CC3A"/><text x="326.5" y="159" fill="#111111" font-size="12.5">2</text>
        <rect x="368" y="140" width="75" height="30" rx="4" fill="#2B5C8A"/><text x="405.5" y="159" fill="#FFFFFF" font-size="12.5">1</text>
        <rect x="447" y="140" width="75" height="30" rx="4" fill="#A1CC3A"/><text x="484.5" y="159" fill="#111111" font-size="12.5">2</text>
        <rect x="526" y="140" width="75" height="30" rx="4" fill="#2B5C8A"/><text x="563.5" y="159" fill="#FFFFFF" font-size="12.5">1</text>
        <rect x="605" y="140" width="75" height="30" rx="4" fill="#A1CC3A"/><text x="642.5" y="159" fill="#111111" font-size="12.5">2</text>
      </g>
      <text x="445" y="190" text-anchor="middle" font-size="12.5">time on the channel →</text>

      <!-- divider -->
      <line x1="20" y1="212" x2="700" y2="212" stroke="#E5E5E5" stroke-width="1.5" fill="none"/>

      <!-- dedicated: two lanes at once -->
      <text x="20" y="252" font-size="13" font-weight="700" fill="#111111">A separate radio for</text>
      <text x="20" y="270" font-size="13" font-weight="700" fill="#111111">the link back, or a cable</text>
      <text x="20" y="288" font-size="12.5">both hops run at once</text>
      <rect x="210" y="232" width="470" height="30" rx="4" fill="#2B5C8A"/>
      <text x="445" y="251" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">1: the link back, on its own channel or cable, all the time</text>
      <rect x="210" y="270" width="470" height="30" rx="4" fill="#A1CC3A"/>
      <text x="445" y="289" text-anchor="middle" fill="#111111" font-size="12.5" font-weight="700">2: the link to you, all the time</text>
      <text x="445" y="320" text-anchor="middle" font-size="12.5">time →</text>
    </svg>
