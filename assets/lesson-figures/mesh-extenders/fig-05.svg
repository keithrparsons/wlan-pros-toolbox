<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="290">
      <!-- scale: 0 m at x=80, 32 m at x=640, 17.5 px per m -->
      <!-- Row A: extender at 30 m, laptop at 32 m -->
      <text x="20" y="22" font-size="13" font-weight="700" fill="#111111">A. In the dead zone, next to the laptop</text>
      <line x1="80" y1="92" x2="640" y2="92" stroke="#E5E5E5" stroke-width="2" fill="none"/>
      <circle cx="80" cy="92" r="4" fill="#444444"/><circle cx="605" cy="92" r="4" fill="#444444"/><circle cx="640" cy="92" r="4" fill="#444444"/>
      <g transform="translate(50,56)"><g transform="translate(15,0) scale(1.25)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="18" height="7.5" rx="2"/><path d="M7.5 12 L6 4.5 M16.5 12 L18 4.5"/><circle cx="7.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="10.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="13.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/></g></g></g><g transform="translate(591,52)"><g transform="translate(0,2) scale(1.167)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5 V20.5"/><rect x="6" y="6" width="8" height="12" rx="2"/><path d="M6 9.5 H2.5 M6 14.5 H2.5"/><path d="M17 9 A4 4 0 0 1 17 15 M19.8 6.5 A7.2 7.2 0 0 1 19.8 17.5"/></g></g></g><g transform="translate(620,100)"><g transform="translate(7,0) scale(1.083)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M2 19 H22"/></g></g></g><text x="342" y="80" text-anchor="middle" fill="#2B5C8A" font-size="12.5">link back: 30 m (98 ft), 87 Mb/s alone</text>
      <text x="80" y="112" text-anchor="middle" font-size="12.5">main box</text>
      <text x="560" y="116" text-anchor="end" font-size="12.5">extender at 30 m (98 ft), laptop at 32 m (105 ft)</text>
      <text x="20" y="146" font-size="12.5" fill="#111111"><tspan font-weight="700">77 Mb/s</tspan> at the laptop. With no extender at all, the laptop got 87.</text>

      <line x1="20" y1="166" x2="700" y2="166" stroke="#E5E5E5" stroke-width="1.5" fill="none"/>

      <!-- Row B: extender at 16 m -->
      <text x="20" y="192" font-size="13" font-weight="700" fill="#2F5E00">B. Partway, where the main box is still strong</text>
      <line x1="80" y1="248" x2="640" y2="248" stroke="#E5E5E5" stroke-width="2" fill="none"/>
      <circle cx="80" cy="248" r="4" fill="#444444"/><circle cx="360" cy="248" r="4" fill="#444444"/><circle cx="640" cy="248" r="4" fill="#444444"/>
      <g transform="translate(50,212)"><g transform="translate(15,0) scale(1.25)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="18" height="7.5" rx="2"/><path d="M7.5 12 L6 4.5 M16.5 12 L18 4.5"/><circle cx="7.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="10.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="13.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/></g></g></g><g transform="translate(346,208)"><g transform="translate(0,2) scale(1.167)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5 V20.5"/><rect x="6" y="6" width="8" height="12" rx="2"/><path d="M6 9.5 H2.5 M6 14.5 H2.5"/><path d="M17 9 A4 4 0 0 1 17 15 M19.8 6.5 A7.2 7.2 0 0 1 19.8 17.5"/></g></g></g><g transform="translate(620,256)"><g transform="translate(7,0) scale(1.083)"><g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M2 19 H22"/></g></g></g><text x="220" y="236" text-anchor="middle" fill="#2B5C8A" font-size="12.5">16 m (52 ft), 259 Mb/s alone</text>
      <text x="500" y="236" text-anchor="middle" fill="#2F5E00" font-size="12.5">16 m (52 ft), 259 Mb/s alone</text>
      <text x="80" y="268" text-anchor="middle" font-size="12.5">main box</text>
      <text x="360" y="268" text-anchor="middle" font-size="12.5">extender at 16 m (52 ft)</text>
      <text x="600" y="276" text-anchor="end" font-size="12.5">laptop at 32 m (105 ft)</text>
