<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="700" height="200">
      <!-- Matter band over the three Matter devices -->
      <rect x="40" y="16" width="420" height="40" rx="9" fill="#A1CC3A"/>
      <text x="250" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">Matter: one shared language</text>
      <!-- plug --><g transform="translate(80 88) scale(2.5)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M9.5 8.5 V12 M14.5 8.5 V12"/><circle cx="12" cy="15.8" r="1.2" fill="#111111" stroke="none"/></g>
      <!-- bulb --><g transform="translate(220 88) scale(2.5)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17 V15.5 C6.6 14.1 5.5 12 5.5 9.5 A6.5 6.5 0 0 1 18.5 9.5 C18.5 12 17.4 14.1 15 15.5 V17 Z"/><path d="M9.5 19.5 H14.5 M10.5 21.8 H13.5"/></g>
      <!-- lock --><g transform="translate(360 88) scale(2.5)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><circle cx="10" cy="6.8" r="1.1" fill="#111111" stroke="none"/><circle cx="14" cy="6.8" r="1.1" fill="#111111" stroke="none"/><circle cx="10" cy="10.3" r="1.1" fill="#111111" stroke="none"/><circle cx="14" cy="10.3" r="1.1" fill="#111111" stroke="none"/><circle cx="10" cy="13.8" r="1.1" fill="#111111" stroke="none"/><circle cx="14" cy="13.8" r="1.1" fill="#111111" stroke="none"/><path d="M9.5 17.8 H14.5"/></g>
      <!-- divider -->
      <line x1="495" y1="16" x2="495" y2="190" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
      <!-- Zigbee sensor --><g transform="translate(561 91) scale(2.33333)" fill="none" stroke="#2B5C8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="9" height="13" rx="2"/><rect x="15" y="8.5" width="5" height="8" rx="1.5"/><circle cx="8" cy="9.5" r="1" fill="#2B5C8A" stroke="none"/></g>
      <!-- labels -->
      <text x="110" y="170" text-anchor="middle">a plug</text><text x="110" y="186" text-anchor="middle" font-weight="600" fill="#111111">on Wi-Fi</text>
      <text x="250" y="170" text-anchor="middle">a bulb</text><text x="250" y="186" text-anchor="middle" font-weight="600" fill="#111111">on Thread</text>
      <text x="390" y="170" text-anchor="middle">a lock</text><text x="390" y="186" text-anchor="middle" font-weight="600" fill="#111111">on Thread</text>
      <text x="589" y="170" text-anchor="middle">a sensor on Zigbee,</text><text x="589" y="186" text-anchor="middle" font-weight="600" fill="#111111">through a bridge</text>
    </svg>
