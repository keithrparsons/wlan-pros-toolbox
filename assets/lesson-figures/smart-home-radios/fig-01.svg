<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="250">
      <rect x="40" y="24" width="430" height="52" rx="9" fill="#A1CC3A"/>
      <text x="255" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">Matter: the shared language</text>
      <text x="255" y="65" text-anchor="middle" fill="#1A1A1A" font-size="12.5">the same commands, whichever way the device connects</text>
      <rect x="40" y="104" width="130" height="46" rx="8" fill="#1A1A1A"/>
      <text x="105" y="132" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">Wi-Fi</text>
      <rect x="190" y="104" width="130" height="46" rx="8" fill="#1A1A1A"/>
      <text x="255" y="132" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">Thread</text>
      <rect x="340" y="104" width="130" height="46" rx="8" fill="#1A1A1A"/>
      <text x="405" y="132" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">Ethernet</text>
      <text x="105" y="170" text-anchor="middle" font-size="12.5">a radio</text>
      <text x="255" y="170" text-anchor="middle" font-size="12.5">a radio, as a mesh</text>
      <text x="405" y="170" text-anchor="middle" font-size="12.5">a cable</text>
      <!-- Zigbee column -->
      <rect x="540" y="24" width="150" height="52" rx="9" fill="#FFFFFF" stroke="#2B5C8A" stroke-width="2"/>
      <text x="615" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#2B5C8A">Zigbee's own</text>
      <text x="615" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#2B5C8A">language</text>
      <rect x="540" y="104" width="150" height="46" rx="8" fill="#2B5C8A"/>
      <text x="615" y="132" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">Zigbee radio</text>
      <text x="615" y="170" text-anchor="middle" font-size="12.5">needs a Zigbee hub</text>
      <!-- bridge -->
      <g fill="none" stroke="#444444" stroke-width="2.2" stroke-linecap="round"><line x1="484" y1="50" x2="526" y2="50"/></g>
      <path d="M478 50 l9 -6 v12 z M532 50 l-9 -6 v12 z" fill="#444444"/>
      <text x="505" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111111">bridge</text>
      <!-- BLE -->
      <rect x="40" y="196" width="430" height="36" rx="8" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.5"/>
      <text x="255" y="219" text-anchor="middle" fill="#111111" font-size="12.5"><tspan font-weight="700">Bluetooth LE:</tspan> usually just for setup</text>
    </svg>
