 font-size="14" transform="translate(222,154) translate(-11,-7)"><path d="M2 2 L11 7 L2 12" fill="none" stroke="#2F5E00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="170" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#444444">you walk</text><text x="360" y="40" font-size="14" text-anchor="start" font-weight="600" fill="#111111">The phone hands the call</text><text x="360" y="58" font-size="14" text-anchor="start" font-weight="600" fill="#111111">from one to the other</text><path d="M362 92 l6.0 6.0 l11.0 -12.0" fill="none" stroke="#2F5E00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="388" y="104" font-size="14" text-anchor="start" font-weight="600" fill="#2F5E00">quick hand-over:</text><text x="388" y="122" font-size="13" text-anchor="start" font-weight="400" fill="#444444">the call carries on</text><path d="M364 148 l12.0 12.0 M376.0 148 l-12.0 12.0" fill="none" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/><text x="388" y="160" font-size="14" text-anchor="start" font-weight="600" fill="#C0392B">slow hand-over:</text><text x="388" y="178" font-size="13" text-anchor="start" font-weight="400" fill="#444444">the call breaks up or drops</text></svg>
