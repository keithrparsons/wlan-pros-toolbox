<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="300">
    <!-- phone -->
    <g transform="translate(55,150)"><g transform="translate(-48 -48) scale(4)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5 H13.5"/></g><text y="66" text-anchor="middle" font-weight="600">Your phone</text></g>
    <!-- top road -->
    <text x="95" y="20" font-size="13" fill="#444444" font-weight="600">CELLULAR: 4G or 5G calling</text>
    <path d="M85 120 L230 70" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(230,70) rotate(340.974) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><g transform="translate(260,68)"><g transform="translate(-26 -28) scale(2.16667)" fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9 H15.5 M8.5 9 L6.5 21.5 M15.5 9 L17.5 21.5 M12 9 V3"/><path d="M8.5 9 L16.5 15.2 M15.5 9 L7.5 15.2 M7.5 15.2 H16.5 M7.5 15.2 L17.5 21.5 M16.5 15.2 L6.5 21.5"/><path d="M8.3 1.9 A5 5 0 0 0 8.3 7.1 M15.7 1.9 A5 5 0 0 1 15.7 7.1"/></g><text y="42" text-anchor="middle">Cell tower</text></g>
    <path d="M290 70 L540 119" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(540,119) rotate(11.089) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><text x="375" y="66" font-size="13" fill="#444444">the carrier's own cell network</text>
    <!-- bottom road -->
    <text x="95" y="290" font-size="13" fill="#2F5E00" font-weight="600">WI-FI CALLING: a locked tunnel</text>
    <rect x="120" y="205" width="420" height="36" rx="18" fill="#A1CC3A" opacity=".25"/>
    <rect x="120" y="205" width="420" height="36" rx="18" fill="none" stroke="#7A9E26" stroke-width="2.5"/>
    <path d="M85 180 L118 215" stroke="#7A9E26" stroke-width="2.5" fill="none"/>
    <g transform="translate(171 209) scale(1.16667)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#2F5E00" stroke="none"/></g>
    <text x="185" y="262" text-anchor="middle" font-size="13" fill="#444444">a Wi-Fi network</text>
    <g transform="translate(305 208) scale(1.25)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19 H17 A4 4 0 0 0 17.6 11.05 A6 6 0 0 0 6.2 10.5 A4.3 4.3 0 0 0 7 19 Z"/></g>
    <text x="320" y="262" text-anchor="middle" font-size="13" fill="#444444">the public internet</text>
    <g transform="translate(441 208) scale(1.16667)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2"/><path d="M8 10.5 V7.5 A4 4 0 0 1 16 7.5 V10.5 M12 15.2 V17.3"/><circle cx="12" cy="15" r="1.3" fill="#2F5E00" stroke="none"/></g>
    <text x="455" y="262" text-anchor="middle" font-size="13" fill="#444444">sealed to the carrier</text>
    <path d="M540 223 H610 V216" fill="none" stroke="#7A9E26" stroke-width="2.5"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(610,216) rotate(270) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><!-- carrier -->
    <rect x="560" y="95" width="190" height="110" rx="12" fill="#1A1A1A"/>
    <text x="655" y="130" text-anchor="middle" fill="#FFFFFF" font-weight="600" font-size="14">Your carrier</text>
    <text x="655" y="152" text-anchor="middle" fill="#E5E5E5" font-size="13">One calling system</text>
    <text x="655" y="170" text-anchor="middle" fill="#E5E5E5" font-size="13">for both roads</text>
    <text x="655" y="190" text-anchor="middle" fill="#A1CC3A" font-size="13">then on to anyone</text>
  </svg>
