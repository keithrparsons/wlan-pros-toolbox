<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="250">
    <!-- house -->
    <path d="M40 150 L120 85 L200 150 V225 H40 Z" fill="#FFFFFF" stroke="#444444" stroke-width="2.5"/>
    <g transform="translate(103 135) scale(1.41667)" fill="none" stroke="#2F5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#2F5E00" stroke="none"/></g>
    <text x="120" y="200" text-anchor="middle" font-size="13" fill="#444444">Call starts</text>
    <text x="120" y="216" text-anchor="middle" font-size="13" fill="#444444">on Wi-Fi</text>
    <path d="M205 150 H300" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(300,150) rotate(360) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><text x="252" y="140" text-anchor="middle" font-size="13" fill="#444444">you walk out</text>
    <!-- outcomes -->
    <rect x="310" y="20" width="430" height="62" rx="10" fill="#FFFFFF" stroke="#7A9E26" stroke-width="2"/>
    <text x="330" y="45" font-weight="600" fill="#2F5E00">Into 4G or 5G calling coverage</text>
    <text x="330" y="66" font-size="13" fill="#444444">The call can hand over to the cell network and carry on.</text>
    <rect x="310" y="96" width="430" height="62" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
    <text x="330" y="121" font-weight="600" fill="#C0392B">Into weak coverage, or no 4G calling</text>
    <text x="330" y="142" font-size="13" fill="#444444">The call drops. There is nothing for it to hand over to.</text>
    <rect x="310" y="172" width="430" height="62" rx="10" fill="#FBF0EE" stroke="#C0392B" stroke-width="2"/>
    <text x="330" y="197" font-weight="600" fill="#C0392B">An emergency call on AT&amp;T</text>
    <text x="330" y="218" font-size="13" fill="#444444">Disconnects either way, even inside 4G calling coverage.</text>
  </svg>
