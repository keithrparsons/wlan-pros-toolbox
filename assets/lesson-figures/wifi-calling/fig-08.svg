<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="270">
    <rect x="20" y="100" width="150" height="70" rx="12" fill="#1A1A1A"/>
    <text x="95" y="132" text-anchor="middle" fill="#FFFFFF" font-weight="600" font-size="14">You dial</text>
    <text x="95" y="152" text-anchor="middle" fill="#FFFFFF" font-weight="600" font-size="14">911</text>
    <path d="M170 135 H215" stroke="#444444" stroke-width="2.5" fill="none"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(215,135) rotate(360) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><path d="M300 88 L375 135 L300 182 L225 135 Z" fill="#FFFFFF" stroke="#444444" stroke-width="2"/>
    <text x="300" y="131" text-anchor="middle" font-size="13" font-weight="600">Any cell</text>
    <text x="300" y="147" text-anchor="middle" font-size="13" font-weight="600">network?</text>
    <path d="M300 88 V60 H440" fill="none" stroke="#444444" stroke-width="2.5"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(440,60) rotate(360) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><text x="340" y="52" font-size="13" fill="#2F5E00" font-weight="600">Yes</text>
    <rect x="445" y="25" width="310" height="70" rx="10" fill="#FFFFFF" stroke="#7A9E26" stroke-width="2"/>
    <text x="462" y="52" font-weight="600">The phone uses the cell network</text>
    <text x="456" y="74" font-size="13" fill="#444444">even in airplane mode, even with Wi-Fi Calling on</text>
    <path d="M300 182 V210 H440" fill="none" stroke="#444444" stroke-width="2.5"/>
    <g fill="#111111" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(440,210) rotate(360) scale(1.75) translate(-9,-5)"><path d="M0 0L10 5L0 10z" fill="#444444"/></g><text x="340" y="228" font-size="13" fill="#111111" font-weight="600">No</text>
    <rect x="445" y="160" width="310" height="100" rx="10" fill="#FFFFFF" stroke="#8A5A00" stroke-width="2"/>
    <text x="462" y="186" font-weight="600">The call may go over Wi-Fi Calling</text>
    <text x="462" y="208" font-size="13" fill="#444444">The carrier tries your device's location.</text>
    <text x="462" y="226" font-size="13" fill="#444444">If that fails, it can use the address you</text>
    <text x="462" y="244" font-size="13" fill="#444444">registered when you turned the feature on.</text>
  </svg>
