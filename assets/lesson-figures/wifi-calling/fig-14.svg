<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans" font-size="13" fill="#111111" width="760" height="250">
    <text x="20" y="28" font-weight="600">The whole trip, mouth to ear: 150 milliseconds or less feels natural</text>
    <rect x="20" y="42" width="720" height="40" rx="8" fill="#F7F7F5"/>
    <rect x="20" y="42" width="150" height="40" rx="8" fill="#A1CC3A"/>
    <text x="95" y="67" text-anchor="middle" font-size="13" font-weight="600">Your Wi-Fi</text>
    <rect x="170" y="42" width="220" height="40" fill="#E6EEF6"/>
    <text x="280" y="67" text-anchor="middle" font-size="13" font-weight="600">Your internet line</text>
    <rect x="390" y="42" width="350" height="40" fill="#F7F7F5"/><rect x="20" y="42" width="720" height="40" rx="8" fill="none" stroke="#444444" stroke-width="1.5"/>
    <text x="565" y="67" text-anchor="middle" font-size="13" font-weight="600">Internet and carrier, to the other phone</text>
    <text x="20" y="104" font-size="13" fill="#444444">Every part of the trip spends from the same budget. When someone uploads photos on the same connection,</text>
    <text x="20" y="120" font-size="13" fill="#444444">the internet-line slice can grow by hundreds of milliseconds on its own.</text>
    <!-- WMM lanes -->
    <text x="20" y="152" font-weight="600">Wi-Fi's four lanes (WMM, Wi-Fi Multimedia)</text>
    <g font-size="12">
      <rect x="20" y="162" width="720" height="18" rx="4" fill="#7A9E26"/><text x="30" y="175" fill="#FFFFFF" font-weight="600" font-size="13">Voice: the fast lane</text>
      <rect x="20" y="184" width="720" height="18" rx="4" fill="#A1CC3A"/><text x="30" y="197" font-weight="600" font-size="13">Video</text>
      <rect x="20" y="206" width="720" height="18" rx="4" fill="#E5E5E5"/><text x="30" y="219" font-weight="600" font-size="13">Best effort: everyday data</text>
      <rect x="20" y="228" width="720" height="18" rx="4" fill="#F7F7F5" stroke="#E5E5E5"/><text x="30" y="241" font-weight="600" font-size="13">Background</text>
    </g>
  </svg>
