<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="222">
      <!-- header -->
      <g font-weight="700" fill="#111111" text-anchor="middle" font-size="12.5">
        <text x="300" y="26">2.4 GHz</text><text x="410" y="26">5 GHz</text><text x="520" y="26">6 GHz</text><text x="640" y="26">Widest channel</text>
      </g>
      <line x1="20" y1="38" x2="700" y2="38" stroke="#9C9C9C" stroke-width="1.5" fill="none"/>
      <!-- rows at y=62, 96, 130, 164, 198 -->
      <g font-weight="700" fill="#111111" font-size="12.5">
        <text x="30" y="66">Wi-Fi 4</text><text x="30" y="100">Wi-Fi 5</text><text x="30" y="134">Wi-Fi 6</text><text x="30" y="168">Wi-Fi 6E</text><text x="30" y="202">Wi-Fi 7</text>
      </g>
      <g fill="#444444" font-size="11">
        <text x="112" y="66" font-size="12.5">802.11n</text><text x="112" y="100" font-size="12.5">802.11ac</text><text x="112" y="134" font-size="12.5">802.11ax</text><text x="112" y="168" font-size="12.5">802.11ax + 6 GHz</text><text x="112" y="202" font-size="12.5">802.11be</text>
      </g>
      <!-- filled = uses this band; ring = does not -->
      <g fill="#7A9E26">
        <circle cx="300" cy="62" r="9"/><circle cx="410" cy="62" r="9"/>
        <circle cx="410" cy="96" r="9"/>
        <circle cx="300" cy="130" r="9"/><circle cx="410" cy="130" r="9"/>
        <circle cx="300" cy="164" r="9"/><circle cx="410" cy="164" r="9"/><circle cx="520" cy="164" r="9"/>
        <circle cx="300" cy="198" r="9"/><circle cx="410" cy="198" r="9"/><circle cx="520" cy="198" r="9"/>
      </g>
      <g fill="none" stroke="#9C9C9C" stroke-width="2">
        <circle cx="520" cy="62" r="8"/>
        <circle cx="300" cy="96" r="8"/><circle cx="520" cy="96" r="8"/>
        <circle cx="520" cy="130" r="8"/>
      </g>
      <g text-anchor="middle" fill="#111111" font-size="12.5">
        <text x="640" y="66">40 MHz</text><text x="640" y="100">160 MHz</text><text x="640" y="134">160 MHz</text><text x="640" y="168">160 MHz</text><text x="640" y="202" font-weight="700" fill="#2F5E00">320 MHz</text>
      </g>
      <g stroke="#9C9C9C" stroke-width="1"><line x1="20" y1="79" x2="700" y2="79" fill="none"/><line x1="20" y1="113" x2="700" y2="113" fill="none"/><line x1="20" y1="147" x2="700" y2="147" fill="none"/><line x1="20" y1="181" x2="700" y2="181" fill="none"/></g>
    </svg>
