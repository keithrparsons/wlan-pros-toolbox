"13" fill="#1A1A1A"/><text x="394" y="51" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="13">3</text><g transform="translate(430 34) scale(1.6667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M2 19 H22"/></g><text x="448" y="112" text-anchor="middle" font-weight="700" fill="#111111" font-size="13.5">Look it up</text><text x="448" y="140" text-anchor="middle" font-size="12.5">the maker's</text><text x="448" y="160" text-anchor="middle" font-size="12.5">support page</text><rect x="548" y="20" width="160" height="170" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.25"/><circle cx="574" cy="46" r="13" fill="#1A1A1A"/><text x="574" y="51" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="13">4</text><g transform="translate(610 34) scale(1.6667)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 L19.5 5.5 V11 C19.5 16 16.5 19.5 12 21.5 C7.5 19.5 4.5 16 4.5 11 V5.5 Z"/><path d="M8.5 12 L11 14.5 L15.5 9.5"/></g><text x="628" y="112" text-anchor="middle" font-weight="700" fill="#111111" font-size="13.5">Turn on updates</text><text x="628" y="140" text-anchor="middle" font-size="12.5">automatic, if</text><text x="628" y="160" text-anchor="middle" font-size="12.5">it's offered</text><path d="M173 105 l14 0 m-6 -6 l6 6 l-6 6" stroke="#444444" stroke-width="2" fill="none"/><path d="M353 105 l14 0 m-6 -6 l6 6 l-6 6" stroke="#444444" stroke-width="2" fill="none"/><path d="M533 105 l14 0 m-6 -6 l6 6 l-6 6" stroke="#444444" stroke-width="2" fill="none"/></svg>
