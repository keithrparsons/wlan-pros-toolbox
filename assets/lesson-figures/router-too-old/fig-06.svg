<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="300">
      <!-- Q1 -->
      <rect x="20" y="20" width="290" height="64" rx="9" fill="#1A1A1A"/>
      <text x="165" y="47" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">Does it still get security fixes?</text>
      <text x="165" y="67" text-anchor="middle" fill="#E5E5E5" font-size="12.5">maker's support page, app, or provider</text>
      <!-- Q1 no -> replace -->
      <line x1="318" y1="52" x2="398" y2="52" stroke="#444444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M398 45 L410 52 L398 59 Z" fill="#444444"/>
      <text x="358" y="42" text-anchor="middle" font-weight="700" fill="#111111" font-size="12.5">No</text>
      <rect x="420" y="20" width="280" height="64" rx="9" fill="#FBF0EE" stroke="#C0392B" stroke-width="2"/>
      <text x="560" y="47" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C0392B">Replace it</text>
      <text x="560" y="67" text-anchor="middle" font-size="12.5">or ask your provider for a current box</text>
      <!-- Q1 yes -> Q2 -->
      <line x1="165" y1="92" x2="165" y2="114" stroke="#444444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M158 114 L165 126 L172 114 Z" fill="#444444"/>
      <text x="178" y="112" font-weight="700" fill="#111111" font-size="12.5">Yes</text>
      <!-- Q2 -->
      <rect x="20" y="136" width="290" height="64" rx="9" fill="#1A1A1A"/>
      <text x="165" y="163" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">Is it running the newest one?</text>
      <text x="165" y="183" text-anchor="middle" fill="#E5E5E5" font-size="12.5">compare its version with the maker's</text>
      <!-- Q2 no -> update -->
      <line x1="318" y1="168" x2="398" y2="168" stroke="#444444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M398 161 L410 168 L398 175 Z" fill="#444444"/>
      <text x="358" y="158" text-anchor="middle" font-weight="700" fill="#111111" font-size="12.5">No</text>
      <rect x="420" y="136" width="280" height="64" rx="9" fill="#FCF3E2" stroke="#8A5A00" stroke-width="2"/>
      <text x="560" y="163" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8A5A00">Update it, then keep it</text>
      <text x="560" y="183" text-anchor="middle" font-size="12.5">and turn on automatic updates</text>
      <!-- Q2 yes -> keep -->
      <line x1="165" y1="208" x2="165" y2="230" stroke="#444444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M158 230 L165 242 L172 230 Z" fill="#444444"/>
      <text x="178" y="228" font-weight="700" fill="#111111" font-size="12.5">Yes</text>
      <rect x="20" y="252" width="680" height="40" rx="9" fill="#FFFFFF" stroke="#7A9E26" stroke-width="2"/>
      <text x="360" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2F5E00">Keep it, and lock down its settings (the appendix, step A)</text>
    </svg>
