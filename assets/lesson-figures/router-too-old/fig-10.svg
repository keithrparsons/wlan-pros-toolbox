ext><path d="M268 92 L204 92" stroke="#C0392B" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 5"/><g fill="#444444" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dasharray="none" stroke-dashoffset="0" stroke-opacity="1" font-family="IBM Plex Sans" font-size="13" transform="translate(204,92) rotate(180) translate(-11,-6)"><path d="M1 1 L11 6 L1 11 Z" fill="#C0392B"/></g><text x="236" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">gets in</text><text x="54" y="140" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">your TV</text><text x="174" y="140" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">old router</text><text x="296" y="140" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">a stranger</text><text x="180" y="166" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">Both happen at once.</text><rect x="367" y="8" width="345" height="176" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.25"/><circle cx="391" cy="34" r="12" fill="#1A1A1A"/><text x="391" y="39" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">2</text><text x="413" y="39" text-anchor="start" font-size="15" font-weight="700" fill="#111111">Whose box is it?</text><g transform="translate(402 62) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5.5" width="16" height="9" rx="2"/><path d="M18 10 H19.5 C20.9 10 21.5 10.8 21.5 12 V21"/><circle cx="6" cy="10" r="1.1" fill="#111111" stroke="none"/><circle cx="9" cy="10" r="1.1" fill="#111111" stroke="none"/><circle cx="12" cy="10" r="1.1" fill="#111111" stroke="none"/></g><g transform="translate(574 62) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="18" height="7.5" rx="2"/><path d="M7.5 12 L6 4.5 M16.5 12 L18 4.5"/><circle cx="7.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="10.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="13.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/></g><text x="426" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Provider's box</text><text x="426" y="152" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">the provider</text><text x="426" y="170" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">updates it</text><text x="598" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Box you bought</text><text x="598" y="152" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">its maker fixes it,</text><text x="598" y="170" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">you check</text><line x1="512" y1="56" x2="512" y2="172" stroke="#9C9C9C" stroke-width="1" fill="none"/><rect x="8" y="196" width="345" height="176" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.25"/><circle cx="32" cy="222" r="12" fill="#1A1A1A"/><text x="32" y="227" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">3</text><text x="54" y="227" text-anchor="start" font-size="15" font-weight="700" fill="#111111">The 2026 rule</text><g transform="translate(30 250) scale(2.3333)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 3.5 L21 11"/><path d="M5.5 9.5 V20.5 H18.5 V9.5"/><path d="M10 20.5 V15 H14 V20.5"/></g><g transform="translate(98 258) scale(1.8333)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="18" height="7.5" rx="2"/><path d="M7.5 12 L6 4.5 M16.5 12 L18 4.5"/><circle cx="7.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="10.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/><circle cx="13.5" cy="15.75" r="1.1" fill="#111111" stroke="none"/></g><g><circle cx="158" cy="264" r="11" fill="#2F5E00"/><path d="M153 264 l3.5 3.5 l6.5 -7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="180" y="262" text-anchor="start" font-size="14" font-weight="700" fill="#111111">The router you own:</text><text x="180" y="284" text-anchor="start" font-size="14" font-weight="400" fill="#444444">keep using it.</text><text x="180" y="348" text-anchor="middle" font-size="13" font-weight="400" fill="#444444">The rule is about new models.</text><rect x="367" y="196" width="345" height="176" rx="8" fill="#FFFFFF" stroke="#444444" stroke-width="1.25"/><circle cx="391" cy="222" r="12" fill="#1A1A1A"/><text x="391" y="227" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">4</text><text x="413" y="227" text-anchor="start" font-size="15" font-weight="700" fill="#111111">Two passwords</text><g transform="translate(392 240) scale(1.5000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 15.8 A4.5 4.5 0 0 1 15.2 15.8 M5.6 12.6 A9 9 0 0 1 18.4 12.6 M2.5 9.4 A13.5 13.5 0 0 1 21.5 9.4"/><circle cx="12" cy="19" r="1.5" fill="#111111" stroke="none"/></g><g transform="translate(438 240) scale(1.5000)" fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="4.5"/><path d="M11.5 12 H21.5 M17.5 12 V15.5 M20.5 12 V14.5"/></g><text x="486" y="264" text-anchor="start" font-size="14" font-weight="400" fill="#444444">Wi-Fi password</text><g transform="translate(392 294) scale(1.5000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M2 19 H22"/></g><g transform="translate(438 294) scale(1.5000)" fill="none" stroke="#7A9E26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"