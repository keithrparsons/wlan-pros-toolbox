<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" font-family="IBM Plex Sans" font-size="12" fill="#444444" width="720" height="180">
      <rect x="20" y="30" width="200" height="70" rx="9" fill="#FFFFFF" stroke="#7A9E26" stroke-width="2.5"/>
      <text x="120" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2F5E00">1. On sale</text>
      <text x="120" y="80" text-anchor="middle" font-size="12.5">fixes arrive</text>
      <rect x="260" y="30" width="200" height="70" rx="9" fill="#FFFFFF" stroke="#8A5A00" stroke-width="2.5"/>
      <text x="360" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8A5A00">2. No longer sold</text>
      <text x="360" y="80" text-anchor="middle" font-size="12.5">fixes may still arrive</text>
      <rect x="500" y="30" width="200" height="70" rx="9" fill="#FBF0EE" stroke="#C0392B" stroke-width="2.5"/>
      <text x="600" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C0392B">3. End of life</text>
      <text x="600" y="80" text-anchor="middle" font-size="12.5">no more fixes, ever</text>
      <!-- connectors with arrowheads clear of the next box -->
      <g stroke="#444444" stroke-width="2.5" stroke-linecap="round"><line x1="228" y1="65" x2="244" y2="65" fill="none"/><line x1="468" y1="65" x2="484" y2="65" fill="none"/></g>
      <g fill="#444444"><path d="M243 59 L253 65 L243 71 Z"/><path d="M483 59 L493 65 L483 71 Z"/></g>
      <!-- brackets underneath -->
      <path d="M20 118 V128 H460 V118" fill="none" stroke="#7A9E26" stroke-width="2"/>
      <text x="240" y="150" text-anchor="middle" fill="#2F5E00" font-weight="600" font-size="12.5">while fixes come, holes get closed</text>
      <path d="M500 118 V128 H700 V118" fill="none" stroke="#C0392B" stroke-width="2"/>
      <text x="600" y="150" text-anchor="middle" fill="#C0392B" font-weight="600" font-size="12.5">new holes stay open</text>
      <text x="360" y="172" text-anchor="middle" font-size="12.5" fill="#444444">Not to scale. How long each stage lasts is up to the maker, and it varies.</text>
    </svg>
