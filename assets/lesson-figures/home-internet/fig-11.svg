<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="IBM Plex Sans" font-size="13" fill="#1A1A1A" width="700" height="250">
      <!-- axis A 0-100ms at x=150..500 (3.5 px/ms); axis B 400-800 at x=540..690 (0.375 px/ms) -->
      <g font-size="11" fill="#444444">
        <line x1="150" y1="210" x2="500" y2="210" stroke="#9C9C9C" fill="none"/>
        <text x="150" y="226" text-anchor="middle" font-size="12">0</text><text x="325" y="226" text-anchor="middle" font-size="12">50</text><text x="500" y="226" text-anchor="middle" font-size="12">100 ms</text>
        <line x1="540" y1="210" x2="690" y2="210" stroke="#9C9C9C" fill="none"/>
        <text x="540" y="226" text-anchor="middle" font-size="12">400</text><text x="690" y="226" text-anchor="end" font-size="12">800 ms</text>
        <path d="M512 204 l8 12 M522 204 l8 12" stroke="#444444" fill="none"/>
      </g>
      <text x="10" y="37" font-weight="600">Fiber</text>
      <rect x="174.5" y="24" width="24.5" height="18" rx="3" fill="#A1CC3A"/><text x="206" y="38">7 to 14 ms</text>
      <text x="10" y="75" font-weight="600">Cable</text>
      <rect x="192" y="62" width="42" height="18" rx="3" fill="#A1CC3A"/><text x="241" y="76">12 to 24 ms</text>
      <text x="10" y="113" font-weight="600">DSL</text>
      <rect x="230.5" y="100" width="38.5" height="18" rx="3" fill="#A1CC3A"/><text x="276" y="114">23 to 34 ms</text>
      <text x="10" y="151" font-weight="600">Low-orbit satellite</text>
      <rect x="237.5" y="138" width="122.5" height="18" rx="3" fill="#2B5C8A"/><text x="367" y="152">25 to 60 ms (Starlink's figure)</text>
      <text x="10" y="189" font-weight="600">High-orbit satellite</text>
      <rect x="570" y="176" width="75" height="18" rx="3" fill="#1A1A1A"/>
      <text x="562" y="190" text-anchor="end" font-size="12">physics alone: about 480 ms</text>
      <text x="645" y="166" text-anchor="end" font-size="12">measured: about 680 ms</text>
    </svg>
