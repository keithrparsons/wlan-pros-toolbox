<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wi-Fi Privacy Myths: a phone outline calling out (two arcs to its
         right), the lesson's point that the phone itself does the revealing:
         its address, and a hidden network's name. Distinct by silhouette from
         the shield (wpa-security), the tag (mac-oui-lookup) and the disc with
         arcs (find-my-explained). -->
    <rect x="3" y="3" width="10" height="18" rx="2"/>
    <path d="M7 17.5 H9"/>
    <path d="M16 9 A4.5 4.5 0 0 1 16 15"/>
    <path d="M19 6.5 A8 8 0 0 1 19 17.5"/>
  </g>
</svg>
