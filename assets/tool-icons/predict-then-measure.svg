<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- top-down floor plan -->
    <rect x="3" y="3" width="18" height="14" rx="2"/>
    <!-- the wall whose loss the design only assumed -->
    <path d="M13 3 V11"/>
    <!-- the AP on a stick: a small AP on its pole -->
    <rect x="5.5" y="5.5" width="3" height="3" fill="currentColor" stroke="none"/>
    <path d="M7 8.5 V11.5"/>
    <!-- the walk crosses the wall, with a sample on each side -->
    <path d="M9.5 14 H17.5" stroke-width="1.5"/>
    <circle cx="10.5" cy="14" r="1.3" fill="currentColor" stroke="none"/>
    <circle cx="16" cy="14" r="1.3" fill="currentColor" stroke="none"/>
    <!-- Wi-Fi Classroom family cue: slider track + knob (interactive simulator) -->
    <path d="M3 20.5 H21"/>
    <circle cx="9" cy="20.5" r="2" fill="currentColor" stroke="none"/>
  </g>
</svg>
