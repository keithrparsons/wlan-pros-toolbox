<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radar sweep: looking OUTWARD at what is already on the air, which is
         what a scan is. Deliberately not a Wi-Fi fan, because a fan reads as
         this device transmitting and the scan is receive-only. -->
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 12 L18.4 5.6"/>
    <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
    <!-- blips: the APs found -->
    <circle cx="16.3" cy="14.8" r="1.3" fill="currentColor" stroke="none"/>
    <circle cx="7.6" cy="9.4" r="1.3" fill="currentColor" stroke="none"/>
  </g>
</svg>
