<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- OFDMA vs MU-MIMO (Charta, 2026-09-30): the tool's two ways to serve
         several clients at once, side by side. Left, one channel cut into
         three resource units (split by frequency); right, two beams leaving
         one point (split by space). Replaces the byte copy of
         mimo-beamforming. Distinct from ofdma-simulator (the same slices,
         but fanned to three client dots) by the two lobes, and from
         mimo-beamforming (an antenna column and one lobe) by the slices. -->
    <rect x="3" y="3" width="6.5" height="13" rx="2"/>
    <path d="M3 7.33 H9.5"/>
    <path d="M3 11.67 H9.5"/>
    <path d="M13 16 C12.5 11 14 6.5 16.5 3.5 C17.5 7 16 12 13 16 Z"/>
    <path d="M13 16 C15.5 12.5 18.5 10 21 9.5 C20.5 12.5 17 15.5 13 16 Z"/>
    <!-- Wi-Fi Classroom family cue: slider track + knob (interactive simulator) -->
    <path d="M3 20.5 H21"/>
    <circle cx="12" cy="20.5" r="2" fill="currentColor" stroke="none"/>
  </g>
</svg>
