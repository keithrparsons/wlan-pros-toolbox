<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connected, No Internet: Captive Portals. A Wi-Fi fan (lower left):
         the link is up. Beside it, a tall sign-in page with two form fields
         and a short button line: the portal the network holds you at.
         Distinct from wifi-vs-internet (fan, divider, cloud) by the portrait
         page, and from speedtest-services (a landscape browser window with a
         gauge) by the fan standing outside the frame. -->
