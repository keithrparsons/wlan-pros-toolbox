<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 268" width="700" height="268" role="img" aria-label="Latency bars: Starlink about 25 ms against geostationary about 600 to 700 ms, and what fills the 25 ms">
<line x1="140" y1="23" x2="140" y2="31" stroke="#9C9C9C" stroke-width="1.5" stroke-linecap="round"/>
<text x="140" y="18.6" font-family="IBM Plex Sans" font-size="13" fill="#9C9C9C" text-anchor="middle" font-weight="400">0 ms</text>
<line x1="355" y1="23" x2="355" y2="31" stroke="#9C9C9C" stroke-width="1.5" stroke-linecap="round"/>
<text x="355" y="18.6" font-family="IBM Plex Sans" font-size="13" fill="#9C9C9C" text-anchor="middle" font-weight="400">300 ms</text>
<line x1="570" y1="23" x2="570" y2="31" stroke="#9C9C9C" stroke-width="1.5" stroke-linecap="round"/>
<text x="570" y="18.6" font-family="IBM Plex Sans" font-size="13" fill="#9C9C9C" text-anchor="middle" font-weight="400">600 ms</text>
<text x="130" y="54.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="end" font-weight="400">Starlink</text>
<rect x="140" y="38" width="18" height="24" rx="0" fill="#A2CC3A"/>
<rect x="158" y="38" width="25" height="24" rx="0" fill="#A2CC3A" opacity="0.45"/>
<text x="192" y="54.9" font-family="IBM Plex Sans" font-size="14" fill="#A2CC3A" text-anchor="start" font-weight="400">about 25 ms typical, 25 to 60 ms range</text>
<text x="130" y="102.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="end" font-weight="400">Geostationary</text>
<rect x="140" y="86" width="430" height="24" rx="0" fill="#3A3A3A" stroke="#9C9C9C" stroke-width="1.5"/>
<rect x="570" y="86" width="72" height="24" rx="0" fill="#3A3A3A" stroke="#9C9C9C" stroke-width="1.5" opacity="0.5"/>
<text x="355" y="102.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="middle" font-weight="400">about 600 to 700 ms</text>
<text x="20" y="161.2" font-family="IBM Plex Sans" font-size="15" fill="#E5E5E5" text-anchor="start" font-weight="600">Zoomed in: inside Starlink's 25 ms (not to the scale above)</text>
<rect x="20" y="172" width="264" height="36" rx="0" fill="rgba(162,204,58,0.08)" stroke="#A2CC3A" stroke-width="2"/>
<rect x="284" y="172" width="396" height="36" rx="0" fill="#3A3A3A"/>
<text x="152" y="194.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="middle" font-weight="400">Radio trip, under 10 ms</text>
<text x="482" y="194.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="middle" font-weight="400">Ground network, scheduling, waiting in line</text>
<text x="20" y="238.6" font-family="IBM Plex Sans" font-size="13" fill="#9C9C9C" text-anchor="start" font-weight="400">SpaceX: each leg between dish, satellite and gateway takes 1.8 to 3.6 ms at the speed of light,</text>
<text x="20" y="258.6" font-family="IBM Plex Sans" font-size="13" fill="#9C9C9C" text-anchor="start" font-weight="400">usually under 10 ms for the whole round trip. The rest is spent on the ground and in queues.</text>
</svg>
