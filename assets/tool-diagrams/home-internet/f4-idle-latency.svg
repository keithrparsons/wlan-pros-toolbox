<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" role="img" aria-label="Idle delay by service on a broken axis: fiber, cable, DSL and low-orbit satellite under 60 ms, high-orbit satellite 480 to 680 ms">
<line x1="150" y1="210" x2="500" y2="210" stroke="#9C9C9C" stroke-width="1" stroke-linecap="butt"/>
<text x="150" y="226" font-family="IBM Plex Sans" font-size="11" fill="#9C9C9C" text-anchor="middle" font-weight="400">0</text>
<text x="325" y="226" font-family="IBM Plex Sans" font-size="11" fill="#9C9C9C" text-anchor="middle" font-weight="400">50</text>
<text x="500" y="226" font-family="IBM Plex Sans" font-size="11" fill="#9C9C9C" text-anchor="middle" font-weight="400">100 ms</text>
<line x1="540" y1="210" x2="690" y2="210" stroke="#9C9C9C" stroke-width="1" stroke-linecap="butt"/>
<text x="540" y="226" font-family="IBM Plex Sans" font-size="11" fill="#9C9C9C" text-anchor="middle" font-weight="400">400</text>
<text x="690" y="226" font-family="IBM Plex Sans" font-size="11" fill="#9C9C9C" text-anchor="end" font-weight="400">800 ms</text>
<path d="M512 204 l8 12 M522 204 l8 12" fill="none" stroke="#9C9C9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="10" y="37" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="600">Fiber</text>
<rect x="174.5" y="24" width="24.5" height="18" rx="3" fill="#A1CC3A"/>
<text x="206.0" y="38" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="400">7 to 14 ms</text>
<text x="10" y="75" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="600">Cable</text>
<rect x="192.0" y="62" width="42.0" height="18" rx="3" fill="#A1CC3A"/>
<text x="241.0" y="76" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="400">12 to 24 ms</text>
<text x="10" y="113" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="600">DSL</text>
<rect x="230.5" y="100" width="38.5" height="18" rx="3" fill="#A1CC3A"/>
<text x="276.0" y="114" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="400">23 to 34 ms</text>
<text x="10" y="151" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="600">Low-orbit satellite</text>
<rect x="237.5" y="138" width="122.5" height="18" rx="3" fill="#E5E5E5"/>
<text x="367.0" y="152" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="400">25 to 60 ms (Starlink's figure)</text>
<text x="10" y="189" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="600">High-orbit satellite</text>
<rect x="570.0" y="176" width="75.0" height="18" rx="3" fill="#9C9C9C"/>
<text x="562.0" y="190" font-family="IBM Plex Sans" font-size="11.5" fill="#E5E5E5" text-anchor="end" font-weight="400">physics alone: about 480 ms</text>
<text x="607.5" y="170" font-family="IBM Plex Sans" font-size="11.5" fill="#E5E5E5" text-anchor="middle" font-weight="400">measured: about 680 ms</text>
</svg>
