<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" role="img" aria-label="The FCC measures up to the router; a phone speed test measures the service plus the Wi-Fi">
<ellipse cx="70" cy="120" rx="58" ry="34" fill="#3A3A3A" stroke="#E5E5E5" stroke-width="2"/>
<text x="70" y="125" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="600">Internet</text>
<line x1="128" y1="120" x2="232" y2="120" stroke="#E5E5E5" stroke-width="4" stroke-linecap="butt"/>
<text x="180" y="110" font-family="IBM Plex Sans" font-size="11.5" fill="#9C9C9C" text-anchor="middle" font-weight="400">provider's line</text>
<rect x="232" y="98" width="86" height="44" rx="6" fill="#3A3A3A" stroke="#E5E5E5" stroke-width="2"/>
<text x="275" y="124" font-family="IBM Plex Sans" font-size="11" fill="#E5E5E5" text-anchor="middle" font-weight="600">Provider's box</text>
<line x1="318" y1="120" x2="360" y2="120" stroke="#E5E5E5" stroke-width="3" stroke-linecap="butt"/>
<rect x="360" y="98" width="86" height="44" rx="6" fill="rgba(162,204,58,0.08)" stroke="#A1CC3A" stroke-width="2.5"/>
<text x="403" y="125" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="600">Router</text>
<line x1="516" y1="120" x2="598" y2="120" stroke="#A1CC3A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
<path d="M470 102 a14 14 0 0 1 0 36" fill="none" stroke="#A1CC3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M484 94 a24 24 0 0 1 0 52" fill="none" stroke="#A1CC3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="545" y="84" font-family="IBM Plex Sans" font-size="11.5" fill="#9C9C9C" text-anchor="middle" font-weight="400">Wi-Fi, through walls</text>
<rect x="605" y="96" width="30" height="50" rx="5" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<text x="620" y="164" font-family="IBM Plex Sans" font-size="11.5" fill="#9C9C9C" text-anchor="middle" font-weight="400">your phone,</text>
<text x="620" y="178" font-family="IBM Plex Sans" font-size="11.5" fill="#9C9C9C" text-anchor="middle" font-weight="400">back bedroom</text>
<path d="M20 60 V48 H446 V60" fill="none" stroke="#E5E5E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="233" y="38" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="600">What the FCC measures: the service, up to the router</text>
<path d="M20 200 V212 H660 V200" fill="none" stroke="#A1CC3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="340" y="232" font-family="IBM Plex Sans" font-size="13" fill="#A1CC3A" text-anchor="middle" font-weight="600">What a speed test on your phone measures: the service plus your Wi-Fi</text>
</svg>
