<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="An emergency call: is any cell network there? Yes, the phone uses it. No, the call may go over Wi-Fi Calling">
<rect x="20" y="100" width="150" height="70" rx="12" fill="#F26E6E" fill-opacity="0.15"/>
<rect x="20" y="100" width="150" height="70" rx="12" fill="none" stroke="#F26E6E" stroke-width="2"/>
<text x="95" y="132" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="middle" font-weight="600">You dial</text>
<text x="95" y="152" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="middle" font-weight="600">911</text>
<line x1="170" y1="135" x2="205.0" y2="135.0" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round"/><path d="M215.00 135.00 L205.00 140.00 L205.00 130.00 Z" fill="#9C9C9C"/>
<path d="M300 88 L375 135 L300 182 L225 135 Z" fill="none" stroke="#E5E5E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="131" font-family="IBM Plex Sans" font-size="12" fill="#E5E5E5" text-anchor="middle" font-weight="600">Any cell</text>
<text x="300" y="147" font-family="IBM Plex Sans" font-size="12" fill="#E5E5E5" text-anchor="middle" font-weight="600">network?</text>
<path d="M300 88 V60" fill="none" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="300" y1="60" x2="430.0" y2="60.0" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round"/><path d="M440.00 60.00 L430.00 65.00 L430.00 55.00 Z" fill="#9C9C9C"/>
<text x="340" y="52" font-family="IBM Plex Sans" font-size="12" fill="#A2CC3A" text-anchor="start" font-weight="600">Yes</text>
<rect x="445" y="25" width="295" height="70" rx="10" fill="none" stroke="#A2CC3A" stroke-width="2"/>
<text x="462" y="52" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="600">The phone uses the cell network</text>
<text x="462" y="74" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">even in airplane mode, even with Wi-Fi Calling on</text>
<path d="M300 182 V210" fill="none" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="300" y1="210" x2="430.0" y2="210.0" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round"/><path d="M440.00 210.00 L430.00 215.00 L430.00 205.00 Z" fill="#9C9C9C"/>
<text x="340" y="228" font-family="IBM Plex Sans" font-size="12" fill="#F26E6E" text-anchor="start" font-weight="600">No</text>
<rect x="445" y="160" width="295" height="100" rx="10" fill="none" stroke="#E0A23A" stroke-width="2"/>
<text x="462" y="186" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="600">The call may go over Wi-Fi Calling</text>
<text x="462" y="208" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">The carrier tries your device's location.</text>
<text x="462" y="226" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">If that fails, it can use the address you</text>
<text x="462" y="244" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">registered when you turned the feature on.</text>
</svg>
