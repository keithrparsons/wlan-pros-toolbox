<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="A call that starts on Wi-Fi at home, and three outcomes when you walk out">
<path d="M40 150 L120 85 L200 150 V225 H40 Z" fill="none" stroke="#E5E5E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M104 146a22 22 0 0 1 32 0M111 153a12 12 0 0 1 18 0" fill="none" stroke="#A2CC3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="120" cy="159" r="3" fill="#A2CC3A"/>
<text x="120" y="200" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="middle" font-weight="400">Call starts</text>
<text x="120" y="216" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="middle" font-weight="400">on Wi-Fi</text>
<line x1="205" y1="150" x2="290.0" y2="150.0" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round"/><path d="M300.00 150.00 L290.00 155.00 L290.00 145.00 Z" fill="#9C9C9C"/>
<text x="252" y="140" font-family="IBM Plex Sans" font-size="11.5" fill="#9C9C9C" text-anchor="middle" font-weight="400">you walk out</text>
<rect x="310" y="20" width="430" height="62" rx="10" fill="none" stroke="#A2CC3A" stroke-width="2"/>
<text x="330" y="45" font-family="IBM Plex Sans" font-size="13" fill="#A2CC3A" text-anchor="start" font-weight="600">Into 4G or 5G calling coverage</text>
<text x="330" y="66" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">The call can hand over to the cell network and carry on.</text>
<rect x="310" y="96" width="430" height="62" rx="10" fill="none" stroke="#F26E6E" stroke-width="2"/>
<text x="330" y="121" font-family="IBM Plex Sans" font-size="13" fill="#F26E6E" text-anchor="start" font-weight="600">Into weak coverage, or no 4G calling</text>
<text x="330" y="142" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">The call drops. There is nothing for it to hand over to.</text>
<rect x="310" y="172" width="430" height="62" rx="10" fill="#F26E6E" fill-opacity="0.12"/>
<rect x="310" y="172" width="430" height="62" rx="10" fill="none" stroke="#F26E6E" stroke-width="2"/>
<text x="330" y="197" font-family="IBM Plex Sans" font-size="13" fill="#F26E6E" text-anchor="start" font-weight="600">An emergency call on AT&amp;T</text>
<text x="330" y="218" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">Disconnects either way, even inside 4G calling coverage.</text>
</svg>
