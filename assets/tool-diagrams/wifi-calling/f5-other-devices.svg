<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Two ways to call from a Mac or iPad: relayed through a nearby iPhone, or Wi-Fi Calling straight to the carrier">
<rect x="10" y="10" width="360" height="270" rx="12" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
<text x="30" y="40" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="start" font-weight="600">1. Calls from iPhone (relay)</text>
<rect x="40" y="98" width="90" height="58" rx="5" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<rect x="45" y="103" width="80" height="48" rx="2" fill="#3A3A3A"/>
<rect x="27" y="158" width="116" height="6" rx="3" fill="#9C9C9C"/>
<text x="85" y="188" font-family="IBM Plex Sans" font-size="12" fill="#E5E5E5" text-anchor="middle" font-weight="400">Mac or iPad</text>
<line x1="146" y1="130" x2="190.0" y2="130.0" stroke="#A2CC3A" stroke-width="2.5" stroke-linecap="round"/><path d="M200.00 130.00 L190.00 135.00 L190.00 125.00 Z" fill="#A2CC3A"/>
<text x="170" y="120" font-family="IBM Plex Sans" font-size="11" fill="#A2CC3A" text-anchor="middle" font-weight="400">same Wi-Fi</text>
<rect x="211.0" y="98.0" width="34" height="64" rx="8" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<rect x="216.0" y="105.0" width="24" height="48" rx="4" fill="#3A3A3A"/>
<text x="228" y="182" font-family="IBM Plex Sans" font-size="12" fill="#E5E5E5" text-anchor="middle" font-weight="400">iPhone</text>
<line x1="250" y1="130" x2="290.0" y2="130.0" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round"/><path d="M300.00 130.00 L290.00 135.00 L290.00 125.00 Z" fill="#9C9C9C"/>
<path d="M328.0 108.8L317.6 145.6M328.0 108.8L338.4 145.6M328.0 108.8V145.6M323.44 124.8L335.68 136.0M332.56 124.8L320.32 136.0M320.32 136.0L338.4 145.6M335.68 136.0L317.6 145.6M314.4 145.6H341.6" fill="none" stroke="#E5E5E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M318.4 104.8a12.8 12.8 0 0 1 19.200000000000003 0" fill="none" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M312.8 100.0a20.8 20.8 0 0 1 30.400000000000002 0" fill="none" stroke="#9C9C9C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="328" y="166" font-family="IBM Plex Sans" font-size="11" fill="#E5E5E5" text-anchor="middle" font-weight="400">cell tower</text>
<text x="30" y="215" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">The iPhone places the call. The Mac or iPad is</text>
<text x="30" y="233" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">just a speaker and microphone. The iPhone must</text>
<text x="30" y="251" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">be switched on, nearby, on the same Wi-Fi.</text>
<rect x="390" y="10" width="360" height="270" rx="12" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
<text x="410" y="40" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="start" font-weight="600">2. Wi-Fi Calling on the device itself</text>
<rect x="415" y="98" width="90" height="58" rx="5" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<rect x="420" y="103" width="80" height="48" rx="2" fill="#3A3A3A"/>
<rect x="402" y="158" width="116" height="6" rx="3" fill="#9C9C9C"/>
<text x="460" y="188" font-family="IBM Plex Sans" font-size="12" fill="#E5E5E5" text-anchor="middle" font-weight="400">Mac in a hotel</text>
<path d="M522 130 H612" fill="none" stroke="#A2CC3A" stroke-width="6" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="522" y1="130" x2="620.0" y2="130.0" stroke="#A2CC3A" stroke-width="2.5" stroke-linecap="round"/><path d="M630.00 130.00 L620.00 135.00 L620.00 125.00 Z" fill="#A2CC3A"/>
<text x="578" y="118" font-family="IBM Plex Sans" font-size="11" fill="#A2CC3A" text-anchor="middle" font-weight="400">internet tunnel</text>
<rect x="645" y="105" width="90" height="50" rx="10" fill="#3A3A3A" stroke="#E5E5E5" stroke-width="2"/>
<text x="690.0" y="126.2" font-family="IBM Plex Sans" font-size="12" fill="#E5E5E5" text-anchor="middle" font-weight="600">Your</text>
<text x="690.0" y="142.2" font-family="IBM Plex Sans" font-size="12" fill="#E5E5E5" text-anchor="middle" font-weight="600">carrier</text>
<text x="410" y="215" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">The iPhone can be off, or at home. The call goes</text>
<text x="410" y="233" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">straight to the carrier. Only some carriers offer</text>
<text x="410" y="251" font-family="IBM Plex Sans" font-size="12" fill="#9C9C9C" text-anchor="start" font-weight="400">it, and 911 may use your registered home address.</text>
</svg>
