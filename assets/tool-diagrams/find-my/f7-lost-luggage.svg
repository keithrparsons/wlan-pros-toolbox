<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="Four steps to share a lost bag with an airline, and two separate settings">
<rect x="10" y="10" width="320" height="80" rx="12" fill="none" stroke="#F26E6E" stroke-width="2"/>
<text x="170" y="44.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">Bag didn't arrive</text>
<text x="170" y="65.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">Check the map first</text>
<line x1="170" y1="94" x2="170.0" y2="104.0" stroke="#9C9C9C" stroke-width="2" stroke-linecap="round"/><path d="M170.00 114.00 L165.00 104.00 L175.00 104.00 Z" fill="#9C9C9C"/>
<rect x="10" y="118" width="320" height="80" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="170" y="163.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">File the airline's baggage report</text>
<line x1="170" y1="202" x2="170.0" y2="212.0" stroke="#9C9C9C" stroke-width="2" stroke-linecap="round"/><path d="M170.00 222.00 L165.00 212.00 L175.00 212.00 Z" fill="#9C9C9C"/>
<rect x="10" y="226" width="320" height="80" rx="12" fill="rgba(162,204,58,0.08)" stroke="#A2CC3A" stroke-width="2"/>
<text x="170" y="249.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">Share Item Location</text>
<text x="94.38" y="270.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Items</text>
<path d="M136.62 263.5 L140.62 267 L136.62 270.5" fill="none" stroke="#9C9C9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="145.62" y="270.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">your tag</text>
<path d="M201.62 263.5 L205.62 267 L201.62 270.5" fill="none" stroke="#9C9C9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210.62" y="270.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">paste</text>
<text x="170" y="292.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">the link in their form</text>
<line x1="170" y1="310" x2="170.0" y2="320.0" stroke="#9C9C9C" stroke-width="2" stroke-linecap="round"/><path d="M170.00 330.00 L165.00 320.00 L175.00 320.00 Z" fill="#9C9C9C"/>
<rect x="10" y="334" width="320" height="80" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="170" y="379.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">Airline staff see a live map</text>
<rect x="360" y="10" width="390" height="92" rx="12" fill="#3A3A3A"/>
<circle cx="398" cy="56" r="18" fill="none" stroke="#A2CC3A" stroke-width="3"/>
<path d="M398 45 V56 L406 61" fill="none" stroke="#A2CC3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="436" y="39.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">The link stops by itself</text>
<text x="436" y="62.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="start" font-weight="400">when you're reunited, after 7 days,</text>
<text x="436" y="84.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="start" font-weight="400">or when you end it</text>
<rect x="360" y="118" width="390" height="180" rx="12" fill="none" stroke="#E0A23A" stroke-width="2"/>
<text x="378" y="151.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Separate switch: Show Contact Info</text>
<text x="378" y="180.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Sharing the link does NOT mark the tag as lost.</text>
<text x="378" y="204.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Also turn on Show Contact Info (once called</text>
<text x="378" y="228.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Lost Mode) with a phone number and message.</text>
<text x="378" y="252.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Anyone who taps the tag with an NFC phone</text>
<text x="378" y="276.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">sees them.</text>
<rect x="360" y="314" width="390" height="72" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="378" y="345.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Keep a device online</text>
<text x="378" y="368.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Updates need one of your devices online.</text>
</svg>
