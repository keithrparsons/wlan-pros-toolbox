<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 584" width="640" height="584" role="img" aria-label="The Find My network in four steps">
<rect x="10" y="20" width="290" height="180" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<circle cx="34" cy="20" r="15" fill="#3A3A3A" stroke="#A2CC3A" stroke-width="2"/>
<text x="34" y="26.2" font-family="IBM Plex Sans" font-size="15" fill="#E5E5E5" text-anchor="middle" font-weight="600">1</text>
<rect x="340" y="20" width="290" height="180" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<circle cx="364" cy="20" r="15" fill="#3A3A3A" stroke="#A2CC3A" stroke-width="2"/>
<text x="364" y="26.2" font-family="IBM Plex Sans" font-size="15" fill="#E5E5E5" text-anchor="middle" font-weight="600">2</text>
<rect x="340" y="240" width="290" height="180" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<circle cx="364" cy="240" r="15" fill="#3A3A3A" stroke="#A2CC3A" stroke-width="2"/>
<text x="364" y="246.2" font-family="IBM Plex Sans" font-size="15" fill="#E5E5E5" text-anchor="middle" font-weight="600">3</text>
<rect x="10" y="240" width="290" height="180" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<circle cx="34" cy="240" r="15" fill="#3A3A3A" stroke="#A2CC3A" stroke-width="2"/>
<text x="34" y="246.2" font-family="IBM Plex Sans" font-size="15" fill="#E5E5E5" text-anchor="middle" font-weight="600">4</text>
<rect x="115.0" y="60" width="80" height="56" rx="8" fill="none" stroke="#9C9C9C" stroke-width="3"/>
<rect x="143.0" y="50" width="24" height="12" rx="3" fill="none" stroke="#9C9C9C" stroke-width="3"/>
<circle cx="155.0" cy="88" r="12" fill="none" stroke="#A2CC3A" stroke-width="3"/>
<circle cx="155.0" cy="88" r="3.5" fill="#A2CC3A"/>
<path d="M205.0 78 a16 16 0 0 1 0 20" fill="none" stroke="#A2CC3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M213.0 71 a26 26 0 0 1 0 34" fill="none" stroke="#A2CC3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="155.0" y="143.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">Your AirTag</text>
<text x="155.0" y="166.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">sends a short</text>
<text x="155.0" y="186.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">Bluetooth "I'm here"</text>
<rect x="465.0" y="46" width="40" height="72" rx="8" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<rect x="470.0" y="53" width="30" height="56" rx="4" fill="#3A3A3A"/>
<text x="485.0" y="143.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">A stranger's iPhone</text>
<text x="485.0" y="166.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">walks past and</text>
<text x="485.0" y="186.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">hears it</text>
<rect x="445.0" y="276" width="72" height="48" rx="4" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<path d="M445.0 276 l36 26 36 -26" fill="none" stroke="#E5E5E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="499.0" y="302" width="24" height="22" rx="3" fill="#A2CC3A"/>
<path d="M504.0 302 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#A2CC3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="485.0" y="363.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">Seals its own location</text>
<text x="485.0" y="386.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">in an envelope only</text>
<text x="485.0" y="406.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">your devices can open</text>
<rect x="135.0" y="266" width="40" height="72" rx="8" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<rect x="140.0" y="273" width="30" height="56" rx="4" fill="#3A3A3A"/>
<circle cx="155.0" cy="300" r="7" fill="#A2CC3A"/>
<text x="155.0" y="363.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">Your iPhone</text>
<text x="155.0" y="386.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">opens it and puts</text>
<text x="155.0" y="406.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">a dot on your map</text>
<line x1="304" y1="110" x2="326.0" y2="110.0" stroke="#9C9C9C" stroke-width="2" stroke-linecap="round"/><path d="M336.00 110.00 L326.00 115.00 L326.00 105.00 Z" fill="#9C9C9C"/>
<line x1="485" y1="204" x2="485.0" y2="226.0" stroke="#9C9C9C" stroke-width="2" stroke-linecap="round"/><path d="M485.00 236.00 L480.00 226.00 L490.00 226.00 Z" fill="#9C9C9C"/>
<line x1="336" y1="330" x2="314.0" y2="330.0" stroke="#9C9C9C" stroke-width="2" stroke-linecap="round"/><path d="M304.00 330.00 L314.00 325.00 L314.00 335.00 Z" fill="#9C9C9C"/>
<rect x="10" y="440" width="620" height="60" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="320" y="465.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">The stranger is never told</text>
<text x="320" y="486.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="middle" font-weight="400">It happens in the background, anonymously</text>
<rect x="10" y="512" width="620" height="60" rx="12" fill="#3A3A3A"/>
<text x="320" y="537.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="middle" font-weight="600">Apple's servers pass the sealed envelope along</text>
<text x="320" y="558.9" font-family="IBM Plex Sans" font-size="14" fill="#E5E5E5" text-anchor="middle" font-weight="400">Apple can't open it, and doesn't know who found what</text>
</svg>
