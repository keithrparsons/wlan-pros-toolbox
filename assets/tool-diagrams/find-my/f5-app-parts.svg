<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" width="640" height="570" role="img" aria-label="A simplified Find My app with People, Devices, Items and Me tabs, and an Apple Watch">
<rect x="20" y="10" width="220" height="334" rx="28" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<path d="M32 96H228M32 176H228M85 22V272M160 22V272" fill="none" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="70" cy="70" r="8" fill="#E5E5E5"/>
<rect x="130" y="124" width="12" height="18" rx="2" fill="#9C9C9C"/>
<circle cx="190" cy="214" r="9" fill="none" stroke="#A2CC3A" stroke-width="3"/>
<line x1="32" y1="272" x2="228" y2="272" stroke="#9C9C9C" stroke-width="1" stroke-linecap="round"/>
<circle cx="56.5" cy="290" r="7" fill="#9C9C9C"/>
<text x="56.5" y="320.6" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="400">People</text>
<rect x="99.5" y="282" width="12" height="16" rx="2" fill="#9C9C9C"/>
<text x="105.5" y="320.6" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="400">Devices</text>
<circle cx="154.5" cy="290" r="7" fill="#9C9C9C"/>
<text x="154.5" y="320.6" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="400">Items</text>
<circle cx="203.5" cy="290" r="7" fill="#9C9C9C"/>
<text x="203.5" y="320.6" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="400">Me</text>
<rect x="270" y="10" width="360" height="80" rx="10" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="286" y="37.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">People</text>
<text x="286" y="58.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Friends and family sharing with you.</text>
<text x="286" y="80.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Get directions, notifications, Find.</text>
<rect x="270" y="102" width="360" height="80" rx="10" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="286" y="129.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Devices</text>
<text x="286" y="150.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Your iPhone, iPad, Mac, Watch, AirPods.</text>
<text x="286" y="172.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Play sound, Lost Mode, erase.</text>
<rect x="270" y="194" width="360" height="80" rx="10" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="286" y="221.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Items</text>
<text x="286" y="242.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">AirTags and other network tags.</text>
<text x="286" y="264.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Up to 32 per Apple Account.</text>
<rect x="270" y="286" width="360" height="58" rx="10" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="286" y="313.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Me</text>
<text x="286" y="334.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Turn Share My Location on or off.</text>
<rect x="40" y="376" width="150" height="180" rx="40" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
<rect x="192" y="436" width="10" height="34" rx="4" fill="#9C9C9C"/>
<rect x="62" y="402" width="86" height="26" rx="13" fill="#3A3A3A" stroke="#9C9C9C" stroke-width="1.2"/>
<text x="76" y="419.6" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="start" font-weight="400">Items</text>
<path d="M124 411 L134 411 L129 419 Z" fill="#E5E5E5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="115" cy="486" r="9" fill="none" stroke="#A2CC3A" stroke-width="3"/>
<text x="230" y="441.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Apple Watch, watchOS 27</text>
<text x="230" y="464.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">One Find My app. The button at top left</text>
<text x="230" y="486.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">switches Devices, People, Items.</text>
</svg>
