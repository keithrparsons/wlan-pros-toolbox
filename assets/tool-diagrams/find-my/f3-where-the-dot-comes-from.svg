<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Three location sources feed the finder phone, which reports the dot">
<rect x="10" y="20" width="250" height="70" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="82" y="50.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">GPS satellites</text>
<text x="82" y="72.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">strong outdoors</text>
<rect x="10" y="130" width="250" height="70" rx="12" fill="rgba(162,204,58,0.08)" stroke="#A2CC3A" stroke-width="2"/>
<text x="82" y="160.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Wi-Fi access points</text>
<text x="82" y="182.9" font-family="IBM Plex Sans" font-size="14" fill="#A2CC3A" text-anchor="start" font-weight="600">does the work indoors</text>
<rect x="10" y="240" width="250" height="70" rx="12" fill="none" stroke="#9C9C9C" stroke-width="1.5"/>
<text x="82" y="270.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Cell towers</text>
<text x="82" y="292.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">a rough fix anywhere</text>
<rect x="37" y="49" width="18" height="12" rx="2" fill="#9C9C9C"/>
