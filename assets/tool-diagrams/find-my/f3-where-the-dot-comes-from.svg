<line x1="262" y1="275" x2="348.34" y2="202.43" stroke="#9C9C9C" stroke-width="2" stroke-linecap="round"/><path d="M356.00 196.00 L351.56 206.26 L345.13 198.61 Z" fill="#9C9C9C"/>
