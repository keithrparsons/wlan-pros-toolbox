<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" role="img" aria-label="Nested ranges around a tag: network, Bluetooth, Ultra Wideband, NFC">
<circle cx="140" cy="150" r="125" fill="#A2CC3A" opacity="0.07"/>
<circle cx="140" cy="150" r="125" fill="none" stroke="#9C9C9C" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="140" cy="150" r="80" fill="#A2CC3A" opacity="0.12"/>
<circle cx="140" cy="150" r="80" fill="none" stroke="#9C9C9C" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="140" cy="150" r="40" fill="#A2CC3A" opacity="0.2"/>
<circle cx="140" cy="150" r="40" fill="none" stroke="#A2CC3A" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="140" cy="150" r="52" fill="none" stroke="#A2CC3A" stroke-width="1.5" stroke-dasharray="2 4"/>
<circle cx="140" cy="146" r="11" fill="none" stroke="#A2CC3A" stroke-width="3"/>
<circle cx="140" cy="146" r="3.5" fill="#A2CC3A"/>
<text x="140" y="174.6" font-family="IBM Plex Sans" font-size="13" fill="#E5E5E5" text-anchor="middle" font-weight="600">tap</text>
<circle cx="202" cy="42" r="3" fill="#9C9C9C"/>
<line x1="202" y1="42" x2="290" y2="30" stroke="#9C9C9C" stroke-width="1.2" stroke-linecap="round"/>
<text x="300" y="35.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Anywhere, eventually: the Find My network</text>
<text x="300" y="56.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Other people's Apple devices report it, if they pass by.</text>
<circle cx="212" cy="116" r="3" fill="#9C9C9C"/>
<line x1="212" y1="116" x2="290" y2="102" stroke="#9C9C9C" stroke-width="1.2" stroke-linecap="round"/>
<text x="300" y="107.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Nearby: Bluetooth</text>
<text x="300" y="128.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">Your own iPhone connects and can play a sound.</text>
<circle cx="178" cy="164" r="3" fill="#9C9C9C"/>
<line x1="178" y1="164" x2="290" y2="174" stroke="#9C9C9C" stroke-width="1.2" stroke-linecap="round"/>
<text x="300" y="179.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Close by: Ultra Wideband (Precision Finding)</text>
<text x="300" y="200.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">An arrow and distance on screen. AirTag 2: about 1.5x farther.</text>
<line x1="152" y1="156" x2="290" y2="244" stroke="#9C9C9C" stroke-width="1.2" stroke-linecap="round"/>
<text x="300" y="251.6" font-family="IBM Plex Sans" font-size="16" fill="#E5E5E5" text-anchor="start" font-weight="600">Touching: NFC</text>
<text x="300" y="272.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">A phone with NFC that taps a lost tag</text>
<text x="300" y="292.9" font-family="IBM Plex Sans" font-size="14" fill="#9C9C9C" text-anchor="start" font-weight="400">sees the owner's contact info.</text>
</svg>
